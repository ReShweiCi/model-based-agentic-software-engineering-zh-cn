name: Build and Release Chinese PDFs

on:
  push:
    branches: [main]
    paths:
      - 'translations/zh-CN/**'
      - '.github/workflows/build-zh-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Noto CJK Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Install Typst 0.15.1
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst
          typst --version

      - name: Compile Chinese PDFs
        run: |
          mkdir -p dist
          typst compile --root translations/zh-CN \
            translations/zh-CN/se-handbook/book-zh.typ \
            dist/software-engineering-handbook-zh.pdf
          typst compile --root translations/zh-CN \
            translations/zh-CN/mage/book-zh.typ \
            dist/mage-book-zh.pdf
          ls -lh dist/

      - name: Publish PDFs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zh-pdf-latest"
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          printf '%s\n' \
            "由 GitHub Actions 自动编译发布的非官方中文译本 PDF（基于原著 MIT License 仓库，提交 \`${SHORT_SHA}\`，构建于 ${BUILD_DATE}）：" \
            "" \
            "- \`software-engineering-handbook-zh.pdf\`：《软件工程手册：一种判断与决策的方法》（*The Software Engineering Handbook*）" \
            "- \`mage-book-zh.pdf\`：《基于模型的智能体工程（MAGE）：软件工程案例研究》（*Model-Based Agentic Engineering*）" \
            "" \
            "原著作者：James C. Davis（[上游仓库](https://github.com/davisjam/model-based-agentic-software-engineering)）" \
            > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/software-engineering-handbook-zh.pdf \
              dist/mage-book-zh.pdf \
              --clobber
            gh release edit "$TAG" \
              --title "中文版 PDF（最新自动构建）" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              dist/software-engineering-handbook-zh.pdf \
              dist/mage-book-zh.pdf \
              --title "中文版 PDF（最新自动构建）" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
