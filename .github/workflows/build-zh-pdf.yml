name: Build and Release Chinese PDFs & EPUBs

on:
  push:
    branches: [main]
    paths:
      - 'translations/zh-CN/**'
      - '.github/workflows/build-zh-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow for EPUB cover generation
        run: python3 -m pip install --quiet pillow

      - name: Install Noto CJK Chinese fonts and librsvg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk librsvg2-bin
          fc-cache -fv >/dev/null
          rsvg-convert --version

      - name: Install Typst 0.15.1
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst
          typst --version

      - name: Compile Chinese PDFs & EPUB3s
        run: |
          mkdir -p dist
          typst compile --root translations/zh-CN \
            translations/zh-CN/se-handbook/book-zh.typ \
            dist/software-engineering-handbook-zh.pdf
          typst compile --root translations/zh-CN \
            translations/zh-CN/mage/book-zh.typ \
            dist/mage-book-zh.pdf
          python3 translations/zh-CN/scripts/build_zh_epub.py --out-dir dist
          python3 translations/zh-CN/scripts/build_zh_epub.py --check \
            dist/software-engineering-handbook-zh.epub \
            dist/mage-book-zh.epub
          ls -lh dist/

      - name: Publish PDFs & EPUBs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zh-pdf-latest"
          printf '%s\n' \
            "非官方中文译本（PDF & EPUB）：" \
            "" \
            "- 《软件工程手册》：\`software-engineering-handbook-zh.pdf\` · \`software-engineering-handbook-zh.epub\`" \
            "- 《基于模型的智能体工程（MAGE）》：\`mage-book-zh.pdf\` · \`mage-book-zh.epub\`" \
            "" \
            "原著作者：James C. Davis（[上游仓库](https://github.com/davisjam/model-based-agentic-software-engineering)，MIT License）" \
            > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/software-engineering-handbook-zh.pdf \
              dist/software-engineering-handbook-zh.epub \
              dist/mage-book-zh.pdf \
              dist/mage-book-zh.epub \
              --clobber
            gh release edit "$TAG" \
              --title "中文版 PDF & EPUB" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              dist/software-engineering-handbook-zh.pdf \
              dist/software-engineering-handbook-zh.epub \
              dist/mage-book-zh.pdf \
              dist/mage-book-zh.epub \
              --title "中文版 PDF & EPUB" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
