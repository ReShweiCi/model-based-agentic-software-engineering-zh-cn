<text x="222" y="16.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="10.8" font-weight="700" font-style="normal">(b) 按页分块</text>
<text x="370" y="16.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="10.8" font-weight="700" font-style="normal">(c) 骨架化</text>
