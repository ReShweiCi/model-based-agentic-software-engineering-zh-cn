<svg xmlns="http://www.w3.org/2000/svg" width="444" height="218" viewBox="0 0 444 218" role="img" aria-labelledby="title desc">
<title id="title">三种文档内存驻留方案</title>
<desc id="desc">整份文档工作进程保留全部结构与媒体。按页分块工作进程各自保留一部分结构与媒体。骨架化工作进程只保留结构与媒体引用，媒体本身驻留在进程内存之外。</desc>
