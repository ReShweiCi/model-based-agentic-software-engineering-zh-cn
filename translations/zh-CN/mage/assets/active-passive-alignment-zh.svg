<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 240" width="446" height="240" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">主动对齐与被动对齐</title>
<desc id="desc">上下两个浅灰面板。主动对齐使用承载预期义务的模型来比对并发现差距、借助智能体修改系统、评估并检查对齐，反复迭代直至符合模型并产出已对齐的系统。随后保留这些模型与机制。被动对齐对照同样的模型与已知义务评估拟议变更，准入或拒绝变更，持续守护约束义务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect x="1" y="1" width="442" height="99" rx="6" fill="#f2f2f2" stroke="#888" stroke-width=".45"/>
<rect x="1" y="128" width="442" height="109" rx="6" fill="#f2f2f2" stroke="#888" stroke-width=".45"/>
<path d="M101 10 L101 91" fill="none" stroke="#888" stroke-width="0.45"/>
<path d="M101 137 L101 222" fill="none" stroke="#888" stroke-width="0.45"/>
<text x="11" y="24" text-anchor="start" font-size="10" font-weight="700">主动对齐</text>
<text x="11" y="37" text-anchor="start" font-size="9.5" font-weight="700">（推动收敛）</text>
<text x="11" y="55" text-anchor="start" font-size="8.5" font-style="italic">使用模型推动系统</text>
<text x="11" y="67" text-anchor="start" font-size="8.5" font-style="italic">发生变更，直至系统</text>
<text x="11" y="79" text-anchor="start" font-size="8.5" font-style="italic">满足模型要求。</text>
<text x="11" y="148" text-anchor="start" font-size="10" font-weight="700">被动对齐</text>
<text x="11" y="161" text-anchor="start" font-size="9.5" font-weight="700">（持续维持）</text>
<text x="11" y="180" text-anchor="start" font-size="8.5" font-style="italic">使用同一套模型与</text>
<text x="11" y="192" text-anchor="start" font-size="8.5" font-style="italic">机制持续保持系统</text>
<text x="11" y="204" text-anchor="start" font-size="8.5" font-style="italic">处于对齐状态。</text>
<rect x="112" y="28" width="68" height="37" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="110" y="30" width="68" height="37" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="108" y="32" width="68" height="37" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="142" y="45" text-anchor="middle" font-size="9.5">模型 M</text>
<text x="142" y="59" text-anchor="middle" font-size="8.5" font-style="italic">预期约束义务</text>
<rect x="192" y="26" width="47" height="43" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="251" y="26" width="57" height="43" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="320" y="26" width="50" height="43" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="382" y="26" width="49" height="43" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="215.5" y="43" text-anchor="middle" font-size="8.5">比对并</text>
<text x="215.5" y="56" text-anchor="middle" font-size="8.5">发现差距</text>
<text x="279.5" y="43" text-anchor="middle" font-size="8.5">修改系统</text>
<text x="279.5" y="56" text-anchor="middle" font-size="8" font-style="italic">（借助智能体）</text>
<text x="345" y="43" text-anchor="middle" font-size="8.5">评估并</text>
<text x="345" y="56" text-anchor="middle" font-size="8.5">检查对齐</text>
<text x="406.5" y="41" text-anchor="middle" font-size="8.5">已对齐</text>
<text x="406.5" y="52" text-anchor="middle" font-size="8.5">系统</text>
<text x="406.5" y="64" text-anchor="middle" font-size="9.5">S′</text>
<path d="M180 47 L192 47" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M239 47 L251 47" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M308 47 L320 47" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M370 47 L382 47" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M345 69 L345 82 L215.5 82 L215.5 69" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="275.5" y="94" text-anchor="middle" font-size="8.5" font-style="italic">重复迭代直至符合要求</text>
<path d="M128.5 100 L128.5 124" fill="none" stroke="#111" stroke-width="1" marker-end="url(#arrow)"/>
<text x="140" y="110" text-anchor="start" font-size="8.5" font-style="italic">一旦主动对齐完成，</text>
<text x="140" y="122" text-anchor="start" font-size="8.5" font-style="italic">即保留这些模型与机制。</text>
<rect x="219" y="134" width="78" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="217" y="136" width="78" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="215" y="138" width="78" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="254" y="150" text-anchor="middle" font-size="9.5">模型 M</text>
<text x="254" y="161" text-anchor="middle" font-size="8.5" font-style="italic">已知约束义务</text>
<rect x="111" y="179" width="75" height="32" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="215" y="178" width="81" height="37" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="336" y="179" width="65" height="32" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="148.5" y="192" text-anchor="middle" font-size="8.5">拟议变更</text>
<text x="148.5" y="204" text-anchor="middle" font-size="9">ΔS</text>
<text x="255.5" y="193" text-anchor="middle" font-size="8.5">对照模型</text>
<text x="255.5" y="206" text-anchor="middle" font-size="8.5">评估该变更</text>
<text x="368.5" y="192" text-anchor="middle" font-size="8.5">更新后的</text>
<text x="368.5" y="204" text-anchor="middle" font-size="8.5">系统 S′</text>
<path d="M254 165 L254 178" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M186 195 L215 195" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M296 195 L336 195" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="330" y="172" text-anchor="middle" font-size="8.5" font-style="italic">准入或拒绝</text>
<path d="M368.5 211 L368.5 223 L148.5 223 L148.5 211" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="258.5" y="235" text-anchor="middle" font-size="8.5" font-style="italic">持续守护约束义务</text>
</svg>