<path d="M271 111 L282 126" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<path d="M254 135 L278 135" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<circle cx="246" cy="135" r="7" fill="#ffffff" stroke="#111111" stroke-width=".9" />
<circle cx="266" cy="104" r="7" fill="#ffffff" stroke="#111111" stroke-width=".9" />
<circle cx="286" cy="135" r="7" fill="#ffffff" stroke="#111111" stroke-width=".9" />
