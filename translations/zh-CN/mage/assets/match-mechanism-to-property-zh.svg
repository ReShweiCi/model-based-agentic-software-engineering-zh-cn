<path d="M338.5 153 L338.5 161" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<rect x="8" y="161" width="207" height="30" rx="3" fill="#f0f0f0" stroke="#111111" stroke-width=".8" />
<rect x="234" y="161" width="207" height="30" rx="3" fill="#f0f0f0" stroke="#111111" stroke-width=".8" />
<text x="111.5" y="173.857" text-anchor="middle" font-size="10" font-weight="700">运行时约束</text>
<text x="111.5" y="185.857" text-anchor="middle" font-size="9" font-style="italic">（直接排除无效状态迁移）</text>
<text x="337.5" y="173.857" text-anchor="middle" font-size="10" font-weight="700">模型分析</text>
<text x="337.5" y="185.857" text-anchor="middle" font-size="9" font-style="italic">（检验所建模协议的行为）</text>
</svg>
