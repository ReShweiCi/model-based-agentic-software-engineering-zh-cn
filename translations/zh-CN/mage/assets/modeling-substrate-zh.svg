<text x="286" y="51.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5">状态机</text>
<rect x="244.0" y="84.0" width="86" height="42" rx="3" fill="white" stroke="black" stroke-width=".65"/>
<text x="287" y="102" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="700">部署拓扑</text>
<text x="287" y="116" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="8.5">（运行于何处）</text>
