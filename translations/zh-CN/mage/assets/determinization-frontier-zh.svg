<svg xmlns="http://www.w3.org/2000/svg" width="538.667" height="462.667" viewBox="0 0 404 347" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">确定化前沿</title>
<desc id="desc">重复性判断既可以走已具备机械评估条件的路径，也可以经由建模改变表示形式以暴露可机械评估的性质。两条路径在对齐阶段汇合：传感器提供证据，验证器进行评估，随后门禁执行裁决，形成可重复决策。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9">
<rect x="65" y="5" width="200" height="25" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="21" font-size="11" text-anchor="middle" font-weight="700">重复性判断</text>
<path d="M165,31 L165,67" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M85,67 L245,67" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<text x="85" y="47" font-size="9" text-anchor="middle">性质需要</text>
<text x="85" y="58" font-size="9" text-anchor="middle">重新推导</text>
<text x="245" y="47" font-size="9" text-anchor="middle">已具备机械</text>
<text x="245" y="58" font-size="9" text-anchor="middle">评估条件</text>
<path d="M85,67 L85,81" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="20" y="83" width="130" height="35" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="85" y="97" font-size="10" text-anchor="middle" font-weight="700">建模</text>
<text x="85" y="110" font-size="9" text-anchor="middle">改变表示形式</text>
<path d="M85,119 L85,131" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="20" y="133" width="130" height="35" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="85" y="147" font-size="9" text-anchor="middle">可机械评估的</text>
<text x="85" y="158" font-size="9" text-anchor="middle">性质</text>
<path d="M85,169 L85,184" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M85,184 L245,184" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M245,67 L245,184" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M165,184 L165,196" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="55" y="198" width="220" height="35" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="212" font-size="10" text-anchor="middle" font-weight="700">对齐</text>
<text x="165" y="225" font-size="9" text-anchor="middle">建立并强制执行评估</text>
<path d="M165,234 L165,246" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="83" y="248" width="164" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="263" font-size="10" text-anchor="middle" font-weight="700">传感器与验证器</text>
<path d="M165,271 L165,283" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="83" y="285" width="164" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="300" font-size="10" text-anchor="middle" font-weight="700">门禁</text>
<path d="M165,308 L165,320" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="55" y="322" width="220" height="21" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="337" font-size="11" text-anchor="middle" font-weight="700">可重复决策</text>
<text x="340" y="249" font-size="9" text-anchor="middle">确定化前沿：</text>
<text x="340" y="261" font-size="9" text-anchor="middle">改变可被机械评估</text>
<text x="340" y="273" font-size="9" text-anchor="middle">的内容（建模），</text>
<text x="340" y="285" font-size="9" text-anchor="middle">随后绑定决策</text>
<text x="340" y="297" font-size="9" text-anchor="middle">（对齐）。</text>
</g>
</svg>
