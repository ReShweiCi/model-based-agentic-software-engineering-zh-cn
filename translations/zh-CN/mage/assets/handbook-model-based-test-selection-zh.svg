<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="756" viewBox="0 -18 444 252" role="img" aria-labelledby="title desc"><title id="title">基于模型的回归测试选择</title><desc id="desc">组件模型与声明的依赖模型推导出变更影响模型（受影响的子系统）。验证覆盖模型将受影响集合映射为选定检查。验证执行模型提供执行模式与解释策略；实际执行产生用于准入验收的执行记录与检查发现。已识别的缺口会将执行扩大至全量测试套件。独立的依赖与覆盖证据及全量对比用于检验选择结果，从而修订模型或扩大验证范围。</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect y="-18" width="444" height="252" fill="white"/>
