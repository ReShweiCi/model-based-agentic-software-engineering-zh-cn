<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 440 74" role="img" aria-labelledby="title desc"><title id="title">恢复顺序模型</title><desc id="desc">恢复生命周期的显式状态，以及允许与禁止的迁移。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#222222"/></marker><marker id="forbidden-arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#a92020"/></marker></defs><rect width="440" height="74" fill="white"/><style>text{font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif;fill:#171717;}path,rect,circle{stroke-linejoin:round;}</style><g transform="translate(0,-20)">
<rect x="2" y="22" width="136" height="34" rx="4" fill="#d9eaf7" stroke="#315f83" stroke-width="0.75"/>
<text x="70" y="36" text-anchor="middle" style="font-size:10px;font-weight:bold;fill:#222222">FALLBACK_STAGED</text>
<text x="70" y="49" text-anchor="middle" style="font-size:9.5px;fill:#222222">（工件位于本地）</text>
