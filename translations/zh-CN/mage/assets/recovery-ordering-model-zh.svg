<text x="220" y="36" text-anchor="middle" style="font-size:10px;font-weight:bold;fill:#222222">FALLBACK_UPLOADED</text>
<text x="220" y="49" text-anchor="middle" style="font-size:9.5px;fill:#222222">（工件已持久化）</text>
<rect x="302" y="22" width="136" height="34" rx="4" fill="#e2f3d5" stroke="#3e7134" stroke-width="0.75"/>
<text x="370" y="36" text-anchor="middle" style="font-size:10px;font-weight:bold;fill:#222222">DB_UPDATED</text>
