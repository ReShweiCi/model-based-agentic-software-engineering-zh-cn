<rect x="5" y="70" width="125" height="40" rx="8" fill="white" stroke="black" stroke-width="0.8"/>
<text x="67.5" y="87.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">变更前值比对</text>
<text x="67.5" y="99.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="normal" fill="black">默认仅作审计</text>
<rect x="5" y="145" width="125" height="40" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="67.5" y="162.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">受支持的操作</text>
<text x="67.5" y="174.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">词汇表</text>
<polygon points="220,135.0 270.0,165 220,195.0 170.0,165" fill="white" stroke="black" stroke-width="0.8"/>
