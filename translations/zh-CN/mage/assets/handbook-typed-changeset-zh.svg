<text x="382.5" y="29.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="normal" fill="black">当前状态</text>
<rect x="180" y="70" width="110" height="40" rx="8" fill="white" stroke="black" stroke-width="0.8"/>
