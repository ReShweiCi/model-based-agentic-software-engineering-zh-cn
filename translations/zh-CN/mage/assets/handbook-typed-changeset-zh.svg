<text x="220" y="174.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">守卫</text>
<rect x="325" y="145" width="105" height="40" rx="8" fill="white" stroke="black" stroke-width="0.8"/>
<text x="377.5" y="168.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">执行变更</text>
<rect x="160" y="218" width="135" height="40" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="227.5" y="235.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">逐条操作结果</text>
<text x="227.5" y="247.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="normal" fill="black">已应用 / 已拒绝 / 失败</text>
<rect x="0" y="292" width="200" height="36" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="100.0" y="307.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">会话日志</text>
<text x="100.0" y="319.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="normal" fill="black">仅记录成功的会话操作</text>
<rect x="240" y="292" width="200" height="36" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="340.0" y="307.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="normal" fill="black">步骤归因</text>
<text x="340.0" y="319.4" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="normal" fill="black">修复流水线变更</text></svg>
