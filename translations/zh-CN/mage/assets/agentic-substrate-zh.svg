<svg xmlns="http://www.w3.org/2000/svg" width="990" height="306" viewBox="-2 -2 440 136" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif"><title id="title">受治理工程环境中的商品化智能</title><desc id="desc">模型研发提供基础模型；基础模型向运行框架发送输出并接收上下文；运行框架在受治理的工程环境中执行动作并获取证据；工程师开发并维护该环境，提供项目知识与动作控制。</desc>
