<?xml version="1.0" encoding="UTF-8"?>
<!-- Localized Chinese SVG (label: governance-conversion). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="figure-title figure-description" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="figure-title">治理转化：针对失败诊断缺失的工程结构，并将其编码为持久结构，使后续工作因继承而受益并沉淀为工程资本</title>
<desc id="figure-description">失败或意外事件引出一个核心问题——缺失了什么？它有五种可能答案：表示/语义、约束义务、证据、评估或强制执行。每条分支对应一种持久编码：模型、不变量、传感器、验证器，或约束/门禁。五条路径汇聚为持久的工程结构，后续工作因继承这些结构而受益，进而积累为工程资本。</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b23b3b"/></marker></defs>
<rect id="failure" x="282" y="6" width="236" height="42" rx="7" fill="#faf1e6" stroke="#b23b3b" stroke-width="2"/>
<text x="400" y="34" text-anchor="middle" font-size="19" fill="#b23b3b" font-weight="700">失败 / 意外事件</text>
<path d="M400 48 L400 66" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect id="diagnosis" x="260" y="68" width="280" height="42" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="400" y="96" text-anchor="middle" font-size="19" fill="#9a3f12" font-weight="700">缺失了什么？</text>
<path d="M400 110 V134 M76 148 V134 H724 V148 M238 134 V148 M400 134 V148 M562 134 V148" fill="none" stroke="#2f5169" stroke-width="2"/>
<text x="76" y="171" text-anchor="middle" font-size="19" fill="#2f5169" font-weight="700">表示</text>
<path d="M76 179 L76 194" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect x="4" y="196" width="144" height="48" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="76" y="226" text-anchor="middle" font-size="19" fill="#1c1917">模型</text>
<path d="M76 244 V263 H400 V282" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<text x="238" y="171" text-anchor="middle" font-size="19" fill="#2f5169" font-weight="700">约束义务</text>
<path d="M238 179 L238 194" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect x="166" y="196" width="144" height="48" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="238" y="226" text-anchor="middle" font-size="19" fill="#1c1917">不变量</text>
<path d="M238 244 V263 H400 V282" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<text x="400" y="171" text-anchor="middle" font-size="19" fill="#2f5169" font-weight="700">证据</text>
<path d="M400 179 L400 194" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect x="328" y="196" width="144" height="48" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="400" y="226" text-anchor="middle" font-size="19" fill="#1c1917">传感器</text>
<path d="M400 244 V263 H400 V282" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<text x="562" y="171" text-anchor="middle" font-size="19" fill="#2f5169" font-weight="700">评估</text>
<path d="M562 179 L562 194" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect x="490" y="196" width="144" height="48" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="562" y="226" text-anchor="middle" font-size="19" fill="#1c1917">验证器</text>
<path d="M562 244 V263 H400 V282" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<text x="724" y="171" text-anchor="middle" font-size="19" fill="#2f5169" font-weight="700">强制执行</text>
<path d="M724 179 L724 194" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect x="652" y="196" width="144" height="48" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="724" y="226" text-anchor="middle" font-size="19" fill="#1c1917">约束 / 门禁</text>
<path d="M724 244 V263 H400 V282" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<rect id="durable" x="165" y="284" width="470" height="42" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="400" y="312" text-anchor="middle" font-size="20" fill="#2f5169" font-weight="700">持久的工程结构</text>
<path d="M400 326 L400 387" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#blue-arrow)"/>
<text x="420" y="350" font-size="18" fill="#1f7a4d">后续工作因继承</text>
<text x="420" y="374" font-size="18" fill="#1f7a4d">这些结构而受益</text>
<rect id="capital" x="230" y="389" width="340" height="44" rx="7" fill="#1f7a4d" stroke="#1f7a4d" stroke-width="2"/>
<text x="400" y="418" text-anchor="middle" font-size="21" fill="#ffffff" font-weight="700">工程资本</text>
<text x="400" y="462" text-anchor="middle" font-size="18" fill="#57534e" font-style="italic">失败并不自动意味着需要再加一道门禁——</text>
<text x="400" y="485" text-anchor="middle" font-size="18" fill="#57534e" font-style="italic">先诊断缺失了什么，再将其编码为持久结构。</text>
</svg>
