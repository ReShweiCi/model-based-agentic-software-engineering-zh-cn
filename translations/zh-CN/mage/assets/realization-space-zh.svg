<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.5 247" width="337.5" height="247" role="img" aria-labelledby="rsTitle rsDesc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <title id="rsTitle">容差界定可接受的实现空间，同时保留自由度</title>
  <desc id="rsDesc">对最多包含 1,000 个姓名的列表进行排序的可能软件实现。左侧区域包含按字母顺序返回姓名的实现；右侧区域包含响应时间不超过 200 毫秒的实现。重叠区域包含同时满足两项需求的实现。每个圆点代表一种不同的可能实现。时间上限设定了容差，而在可接受实现之间的选择则构成自由度。</desc>
  <defs>
    <marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker>
    <marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker>
    <marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker>
    <marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker>
  </defs>
