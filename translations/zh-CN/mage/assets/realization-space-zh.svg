  <text x="61" y="110.0" text-anchor="middle" font-size="9" fill="#ad420d" font-weight="700">排列</text>
  <text x="278" y="99.0" text-anchor="middle" font-size="9" fill="#ad420d" font-weight="700">响应时间</text>
  <text x="278" y="112.0" text-anchor="middle" font-size="9" fill="#ad420d">≤ 200 ms</text>
  <text x="278" y="125.0" text-anchor="middle" font-size="9" fill="#ad420d">（容差）</text>
  <text x="169" y="80.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">可接受的实现</text>
  <text x="169" y="96.0" text-anchor="middle" font-size="9" fill="#1c1917">同时满足两项要求</text>
