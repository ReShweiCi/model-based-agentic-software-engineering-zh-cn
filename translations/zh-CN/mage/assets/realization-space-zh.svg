  <text x="168.75" y="26.0" text-anchor="middle" font-size="9" fill="#1c1917">最多包含 1,000 个姓名的列表</text>
  <rect x="5" y="35" width="327.5" height="177" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
