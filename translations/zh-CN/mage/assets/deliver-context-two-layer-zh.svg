<title id="asTitle">动态上下文注入与强制执行</title>
<desc id="asDesc">三行分别表示智能体工作流、动态上下文选择与工程知识资源库。派发钩子在任务开始时做初始选择，规划后依据精化范围做二次选择，Git 提交前门禁在进入实现前要求提供二次选择的证据。</desc>
<defs><marker id="as-arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker></defs>
