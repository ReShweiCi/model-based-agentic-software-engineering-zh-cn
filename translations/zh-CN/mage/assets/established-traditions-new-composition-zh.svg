<svg xmlns="http://www.w3.org/2000/svg" width="888" height="599" viewBox="0 0 444 299.5" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">成熟传统，全新组合</title>
<desc id="desc">工程传统与 AI 传统共同汇聚于 MAGE。建模使知识显式化，对齐强制执行选定的约束义务。两者共同构建承载工程资本的受治理的工程环境，后续工作继承这些工程资本，以期实现可信自主性。</desc>
