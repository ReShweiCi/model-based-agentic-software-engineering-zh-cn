<text x="221" y="179.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="400" font-style="normal">类型与关系</text>
<path d="M221,142 L221,154" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="301" y="122" width="134" height="20" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="368.0" y="135.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="700" font-style="normal">实现清理</text>
<path d="M368,108 L368,122" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="305" y="154" width="126" height="22" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="368.0" y="168.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="400" font-style="italic">重构或局部整理</text>
<path d="M368,142 L368,154" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="111" y="196" width="220" height="30" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="221" y="207.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="700" font-style="normal">更新使用该模型的代码</text>
<text x="221" y="221.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="700" font-style="normal">强制执行选定的约束义务</text>
<path d="M221,184 L221,196" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="123" y="238" width="196" height="22" rx="3" fill="rgb(235,235,235)" stroke="black" stroke-width=".65"/>
<text x="221.0" y="252.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="700" font-style="normal">改进后的模型与控制机制</text>
<path d="M221,226 L221,238" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<path d="M319,249 L442,249 L442,12 L299,12" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<text x="379" y="9.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="8.5" font-weight="400" font-style="italic">下一轮迭代</text>
