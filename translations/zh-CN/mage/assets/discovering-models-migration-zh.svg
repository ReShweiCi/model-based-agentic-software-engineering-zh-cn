<svg xmlns="http://www.w3.org/2000/svg" width="444" height="262" viewBox="0 0 444 262" role="img" aria-labelledby="title desc">
<title id="title">从现有代码库恢复模型</title>
<desc id="desc">候选位置经分类后对应三种处置：合理实现予以接受或豁免；缺失的模型通过构建类型与关系、更新调用代码并强制执行选定义务来补齐；实现清理通过重构或局部整理完成。改进后的模型与控制机制为下一轮提供更强基础。</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs>
<rect x="143" y="2" width="156" height="20" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="221.0" y="15.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="700" font-style="normal">现有代码库</text>
<rect x="116" y="34" width="210" height="34" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="221" y="44.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="700" font-style="normal">候选位置：</text>
<text x="221" y="55.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="8.5" font-weight="400" font-style="normal">原语密度 · 重复数据结构</text>
<text x="221" y="65.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="8.5" font-weight="400" font-style="normal">组件与边界分析</text>
<path d="M221,22 L221,34" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="143" y="80" width="156" height="20" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="221.0" y="93.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="700" font-style="normal">对发现结果分类</text>
<path d="M221,68 L221,80" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<text x="64" y="87.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="8.5" font-weight="400" font-style="italic">候选位置用于识别</text>
<text x="64" y="99.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="8.5" font-weight="400" font-style="italic">值得调查的工作。</text>
<path d="M221,100 L221,108" fill="none" stroke="black" stroke-width=".7"/>
<path d="M74,108 L368,108" fill="none" stroke="black" stroke-width=".7"/>
<rect x="7" y="122" width="134" height="20" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="74.0" y="135.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="700" font-style="normal">合理的既有实现</text>
<path d="M74,108 L74,122" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="11" y="154" width="126" height="22" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
<text x="74.0" y="168.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9.5" font-weight="400" font-style="italic">接受 / 豁免</text>
<path d="M74,142 L74,154" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="154" y="122" width="134" height="20" rx="3" fill="rgb(235,235,235)" stroke="black" stroke-width=".65"/>
<text x="221.0" y="135.3" text-anchor="middle" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="9" font-weight="700" font-style="normal">缺失的模型</text>
<path d="M221,108 L221,122" fill="none" stroke="black" stroke-width=".7" marker-end="url(#arrow)"/>
<rect x="153" y="154" width="136" height="30" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".65"/>
