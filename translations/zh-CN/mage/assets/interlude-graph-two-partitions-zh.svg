<title id="tpTitle">同一修复图上的两种执行策略</title>
  <desc id="tpDesc">同一张操作依赖图——分析第 1、2、3 页，构建文档上下文，以及对图像 1、2、3 发起 GenAI 查询——在两种调度边界下的对比：(a) 面向页面的执行按工件所在位置分组；(b) 前沿执行按前置条件就绪的时机分组。</desc>
