<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="img" aria-labelledby="levTitle levDesc"
     font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <title id="levTitle">工程杠杆的作用位置</title>
  <desc id="levDesc">上下两条流水线形成对比。在传统模式中，工程师直接编写代码实现，因此代码实现是工程控制的主要作用点：工程师 → 代码实现 → 产品。在智能体模式中，智能体在工程师构建的工程环境中编写代码实现，因此工程环境成为工程控制的主要作用点：工程师 → 工程环境 → 智能体 → 代码实现 → 产品。底部展板将受治理的工程环境展开为模型、义务、证据、控制与基础设施。</desc>

  <defs>
    <marker id="lev-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#fdfcf9"/>

  <!-- title band -->
  <rect x="0" y="0" width="1000" height="54" fill="#f6f4ef"/>
  <text x="500" y="35" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#1c1917">工程杠杆的作用位置</text>

  <!-- ===== CLASSICAL row ===== -->
  <text x="30" y="118" font-size="20" font-weight="700" letter-spacing="1.5" fill="#57534e">传统模式</text>
  <text x="30" y="142" font-size="18" fill="#57534e">工程师直接编写代码实现</text>

  <g fill="none" stroke="#57534e" stroke-width="2.4">
    <path d="M300,185 L378,185" marker-end="url(#lev-k)"/>
    <path d="M590,185 L668,185" marker-end="url(#lev-k)"/>
  </g>

  <rect id="c-engineer" x="150" y="160" width="150" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="225" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">工程师</text>

  <rect id="c-impl" x="380" y="156" width="210" height="58" rx="9" fill="#f3efe7" stroke="#9a3f12" stroke-width="3.2"/>
  <text x="485" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">代码实现</text>
  <text x="485" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3f12">工程控制的主要作用点</text>

  <rect id="c-product" x="670" y="160" width="170" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="755" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">产品</text>

  <!-- divider between regimes -->
  <line x1="30" y1="254" x2="970" y2="254" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- ===== AGENTIC row ===== -->
  <text x="30" y="296" font-size="20" font-weight="700" letter-spacing="1.5" fill="#155c38">智能体模式</text>
  <text x="30" y="320" font-size="18" fill="#57534e">智能体编写代码实现</text>

  <g fill="none" stroke="#57534e" stroke-width="2.4">
    <path d="M150,363 L173,363" marker-end="url(#lev-k)"/>
    <path d="M370,363 L391,363" marker-end="url(#lev-k)"/>
    <path d="M527,363 L548,363" marker-end="url(#lev-k)"/>
    <path d="M720,363 L741,363" marker-end="url(#lev-k)"/>
  </g>

  <rect id="a-engineer" x="30" y="338" width="120" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="90" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">工程师</text>

  <rect id="a-env" x="175" y="332" width="195" height="62" rx="9" fill="#e3f0e7" stroke="#9a3f12" stroke-width="3.4"/>
  <text x="272" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">工程环境</text>

  <rect id="a-agents" x="393" y="338" width="134" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="460" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">智能体</text>

  <rect id="a-impl" x="543.55" y="338" width="182.89" height="50" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="635" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">代码实现</text>

  <rect id="a-product" x="743" y="338" width="150" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="818" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">产品</text>

  <!-- zoom/expansion lines -->
  <g fill="none" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="175" y1="394" x2="120" y2="452"/>
    <line x1="370" y1="394" x2="880" y2="452"/>
  </g>

  <rect x="135" y="398" width="275" height="25" fill="#fdfcf9"/>
  <text x="272" y="418" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3f12">工程控制的主要作用点</text>

  <!-- footer strip -->
  <rect x="120" y="452" width="760" height="86" rx="12" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="478" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">受治理的工程环境（GEE）</text>
  <text x="500" y="501" text-anchor="middle" font-size="17" fill="#57534e">围绕自主实现所构建的工程指令与治理结构</text>
  <text x="500" y="524" text-anchor="middle" font-size="18" fill="#57534e">模型 &#183; 义务 &#183; 证据 &#183; 控制 &#183; 基础设施</text>
</svg>
