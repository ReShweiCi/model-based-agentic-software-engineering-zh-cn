<title id="title">分析依赖图以重新设计执行方式</title>
<desc id="desc">三个并排面板区分了诊断、分解操作与重构依赖关系。原始关键路径耗时 12 秒，另一分支耗时 6 秒。将主导操作拆分为三个并发的 3 秒子操作后，未计开销的关键路径缩短至 7 秒。通过共享渲染上下文，两个图像描述操作变得彼此独立。</desc>
