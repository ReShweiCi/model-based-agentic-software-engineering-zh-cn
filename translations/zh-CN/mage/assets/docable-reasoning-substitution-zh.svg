<rect x="82" y="233" width="280" height="39" rx="3" fill="#fff" stroke="#2f5169" stroke-width=".75"/>
<text x="222" y="249" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">结构化文档模型</text>
