<text x="222" y="330" text-anchor="middle" font-size="9.5" fill="#1c1917">独立验证</text>
<path d="M82,252 L18,252 L18,21 L40,21" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#aflow)"/>
<text x="49" y="186" text-anchor="middle" font-size="9.5" fill="#1c1917" font-style="italic">检视</text>
<text x="49" y="199" text-anchor="middle" font-size="9.5" fill="#1c1917" font-style="italic">文档模型</text>
