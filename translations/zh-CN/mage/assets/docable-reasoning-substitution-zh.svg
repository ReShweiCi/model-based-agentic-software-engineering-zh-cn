<rect x="82" y="178" width="280" height="39" rx="3" fill="#fff" stroke="#086438" stroke-width=".75"/>
<text x="222" y="194" text-anchor="middle" font-size="10.5" fill="#086438" font-weight="700">受控执行器（Controlled Applier）</text>
<text x="222" y="209" text-anchor="middle" font-size="9.5" fill="#1c1917">解析目标 · 校验前置条件 · 执行变更 · 记录结果</text>
