<path d="M382.5,110 L382.5,126 L270,126 L270,142" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M240,182 L240,202" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
