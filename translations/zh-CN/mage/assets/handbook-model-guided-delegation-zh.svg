<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1062" viewBox="0 0 440 354" role="img" aria-labelledby="title desc"><title id="title">具有并行派发与完工决策的受治理委派</title><desc id="desc">工单与组件及约束模型输入有界上下文选择。生命周期策略与已对账阶段状态输入派发决策：该指派是否获得授权？被拒绝的指派在修复或取得有效覆写前不得执行。获授权的智能体保存持久化成果，这些成果在完工时既接受检查，也接受独立校验。校验产出评审证据；完工决策判断约束义务是否已满足。中断或未解决的工作在重新派发前须先检查与对账。状态缺失并非已完成（DONE）的证据。</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="440" height="354" fill="white"/>
