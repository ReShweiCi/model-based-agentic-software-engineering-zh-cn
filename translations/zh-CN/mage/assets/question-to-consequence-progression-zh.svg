<svg xmlns="http://www.w3.org/2000/svg" width="315pt" height="228pt" viewBox="0 0 315 228" role="img" aria-labelledby="qapTitle qapDesc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="qapTitle">从工程问题到工程后果</title>
<desc id="qapDesc">五个阶段：工程问题；建模并定义性质；分析建模所得的性质；解读证据；做出工程决策。决策阶段反馈回建模阶段以修订模型与性质。</desc>
<rect width="315" height="228" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker></defs>
<rect x="84" y="2" width="175" height="21" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="16" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">工程问题</text>
<rect x="35" y="33" width="273" height="48" rx="2.5" fill="#e7edf3" stroke="#2f5169" stroke-width=".65"/>
<text x="171.5" y="47" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">建模并定义性质</text>
<text x="171.5" y="60" text-anchor="middle" font-size="9.5" fill="#1c1917">表示形式：状态机 · 依赖图</text>
<text x="171.5" y="72" text-anchor="middle" font-size="9.5" fill="#1c1917">待检性质：合法转移 · 允许的依赖</text>
<rect x="35" y="91" width="273" height="48" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="105" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">分析建模所得的性质</text>
<text x="171.5" y="118" text-anchor="middle" font-size="9.5" fill="#1c1917">状态探索 · 模型检验 · 仿真</text>
<text x="171.5" y="130" text-anchor="middle" font-size="9.5" fill="#1c1917">约束求解 · 静态分析</text>
<rect x="73" y="149" width="197" height="21" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="163" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">解读证据</text>
<rect x="35" y="180" width="273" height="44" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="194" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">做出工程决策</text>
<text x="171.5" y="207" text-anchor="middle" font-size="9.5" fill="#1c1917">完善架构与设计</text>
<text x="171.5" y="219" text-anchor="middle" font-size="9.5" fill="#1c1917">选择值得强制执行的约束义务</text>
<path d="M171.5 23V33" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M171.5 81V91" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M171.5 139V149" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M171.5 170V180" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M35 202H24V57H35" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="12" y="129.5" text-anchor="middle" font-size="9.5" fill="#1c1917" transform="rotate(-90 12 129.5)">修订模型与性质</text>
