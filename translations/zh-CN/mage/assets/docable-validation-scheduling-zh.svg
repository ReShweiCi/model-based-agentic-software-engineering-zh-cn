<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 302" width="446" height="302" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">将集成与广度验证分离</title>
<desc id="desc">改进前，智能体在进入下一项工作前需等待合并与完整验证。改进后，每次变更通过廉价检查即可合并；每 30 分钟由定时器对主干执行一次串行广度检查，若出现阻塞性失败则暂停派发以诊断修复；部署前仍要求完整验证通过。浅灰底色表示验证工作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<text x="4" y="13" text-anchor="start" font-size="10.5" font-weight="700">改进前：集成与验证耦合</text>
<rect x="18" y="25" width="76" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="130" y="25" width="174" height="27" rx="4" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<rect x="345" y="25" width="80" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="56" y="42" text-anchor="middle" font-size="9.5" font-weight="700">智能体</text>
<text x="217" y="42" text-anchor="middle" font-size="9.5" font-weight="700">合并并运行完整验证</text>
<text x="385" y="42" text-anchor="middle" font-size="9.5" font-weight="700">下一项工作</text>
<path d="M94 39 L130 39" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M304 39 L345 39" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="217" y="65" text-anchor="middle" font-size="9.5" font-style="italic">下一项工作必须等待完整验证完成。</text>
<path d="M4 78 L442 78" fill="none" stroke="#111" stroke-width="0.45"/>
<text x="4" y="94" text-anchor="start" font-size="10.5" font-weight="700">改进后：为不同检查设置独立触发机制</text>
<text x="4" y="111" text-anchor="start" font-size="9.5" font-weight="700">针对每次变更</text>
<rect x="18" y="120" width="70" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="53.0" y="137" text-anchor="middle" font-size="9.5" font-weight="700">智能体</text>
<rect x="108" y="120" width="100" height="27" rx="4" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<text x="158.0" y="137" text-anchor="middle" font-size="9.5" font-weight="700">廉价检查</text>
<rect x="231" y="120" width="78" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="270.0" y="137" text-anchor="middle" font-size="9.5" font-weight="700">合并</text>
<rect x="345" y="120" width="80" height="27" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="385.0" y="137" text-anchor="middle" font-size="9.5" font-weight="700">下一项工作</text>
<path d="M88 134 L108 134" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M208 134 L231 134" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M309 134 L345 134" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="4" y="168" text-anchor="start" font-size="9.5" font-weight="700">每 30 分钟</text>
<rect x="18" y="179" width="70" height="32" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="108" y="179" width="170" height="32" rx="4" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<rect x="341" y="179" width="97" height="32" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="53" y="198" text-anchor="middle" font-size="9.5" font-weight="700">定时器</text>
<text x="193" y="192" text-anchor="middle" font-size="9.5" font-weight="700">主干广度检查</text>
<text x="193" y="205" text-anchor="middle" font-size="8.5">每次仅运行一轮扫描</text>
<text x="389.5" y="192" text-anchor="middle" font-size="9.5" font-weight="700">暂停派发</text>
<text x="389.5" y="205" text-anchor="middle" font-size="8.5">诊断并修复</text>
<path d="M88 195 L108 195" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M278 195 L341 195" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="309" y="177" text-anchor="middle" font-size="8.5" font-style="italic">阻塞性</text>
<text x="309" y="188" text-anchor="middle" font-size="8.5" font-style="italic">失败</text>
<text x="4" y="232" text-anchor="start" font-size="9.5" font-weight="700">部署阶段</text>
<rect x="18" y="242" width="76" height="30" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<rect x="120" y="242" width="158" height="30" rx="4" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<rect x="341" y="242" width="97" height="30" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
<text x="56" y="260" text-anchor="middle" font-size="9.5" font-weight="700">部署请求</text>
<text x="199" y="260" text-anchor="middle" font-size="9.5" font-weight="700">完整验证</text>
<text x="389.5" y="260" text-anchor="middle" font-size="9.5" font-weight="700">部署上线</text>
<path d="M94 257 L120 257" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M278 257 L341 257" fill="none" stroke="#111" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="309" y="248" text-anchor="middle" font-size="8.5" font-style="italic">通过</text>
<rect x="8" y="287" width="27" height="12" rx="2" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<text x="41" y="296" text-anchor="start" font-size="8.5" font-style="italic">= 正在运行验证（测试、分析或测量）</text>
</svg>