<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 354" width="450" height="354" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">从工程模型到强制执行的对齐流程</title>
<desc id="desc">工程模型提供选定的约束义务。一条分支通过约束限制智能体工作，另一条提供由建模义务推导出的评估规则。传感器从工作中获取证据，门禁结合证据、评估规则及可选的约束检查结果决定准入或退回修改。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker></defs>
<rect x="138.0" y="2.0" width="174" height="32" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="16.5" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">工程模型</text>
<text x="225" y="29.5" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">架构 · 行为 · 策略</text>
<rect x="143.0" y="46.0" width="164" height="32" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="60.5" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">选定的约束义务</text>
<text x="225" y="73.5" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">性质 · 边界 · 规则</text>
<rect x="7.0" y="94.0" width="154" height="44" rx="3" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<text x="84" y="109.0" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">约束（Constraints）</text>
<text x="84" y="122.0" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">限制可用动作或状态</text>
<text x="84" y="133.0" text-anchor="middle" font-size="8.5" fill="#1c1917" font-style="italic">（类型、权限、接口）</text>
<rect x="284.0" y="94.0" width="158" height="44" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="363" y="109.0" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">评估规则</text>
<text x="363" y="122.0" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">由建模义务推导出的</text>
<text x="363" y="133.0" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">判定谓词</text>
<rect x="128.0" y="148.0" width="194" height="40" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="161.0" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">智能体工作</text>
<text x="225" y="174.0" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">拟议动作 · 代码实现</text>
<text x="225" y="185.0" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">运行时行为</text>
<rect x="138.0" y="200.0" width="174" height="42" rx="3" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="214.0" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">传感器（Sensors）</text>
<text x="225" y="227.0" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">从工作中获取证据</text>
<text x="225" y="238.0" text-anchor="middle" font-size="8.5" fill="#1c1917" font-style="italic">（静态/动态分析、插桩）</text>
<rect x="134.0" y="253.0" width="182" height="56" rx="3" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="268.5" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">门禁（Gates）</text>
<text x="225" y="281.5" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">依据评估结果控制</text>
<text x="225" y="292.5" text-anchor="middle" font-size="8.8" fill="#1c1917" font-style="italic">工作能否继续放行</text>
<text x="225" y="303.5" text-anchor="middle" font-size="8.5" fill="#1c1917" font-style="italic">（合并、部署、授权）</text>
<rect x="136.0" y="329.0" width="72" height="22" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="172" y="344.0" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">准入</text>
<rect x="220.0" y="329.0" width="102" height="22" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="271" y="344.0" text-anchor="middle" font-size="10.5" fill="#1c1917" font-weight="700">拒绝 / 修订</text>
<path d="M225 34 L225 46" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 78 V82 H84" fill="none" stroke="#1c1917" stroke-width=".65"/>
<path d="M84 82 L84 94" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 82 L363 82 L363 94" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M84 138 L84 168 L128 168" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 188 L225 200" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 242 L225 253" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M363 138 L363 281 L316 281" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M42 138 L42 281 L134 281" fill="none" stroke="#1c1917" stroke-width=".65" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="5" y="224" width="74" height="26" fill="#ffffff"/><text x="42" y="234" text-anchor="middle" font-size="8.8" font-style="italic">约束 /</text><text x="42" y="245" text-anchor="middle" font-size="8.8" font-style="italic">检查结果</text>
<path d="M225 309 V317" fill="none" stroke="#1c1917" stroke-width=".65"/>
<path d="M225 317 L172 317 L172 329" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 317 L271 317 L271 329" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<rect x="324" y="285" width="123" height="62" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<rect x="330" y="291" width="12" height="9" rx="2" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<rect x="330" y="331" width="12" height="9" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="348" y="299" text-anchor="start" font-size="8.8" fill="#1c1917" font-style="italic">对齐职能</text>
<text x="348" y="310" text-anchor="start" font-size="8.5" fill="#1c1917" font-style="italic">（约束、传感器、</text>
<text x="348" y="321" text-anchor="start" font-size="8.5" fill="#1c1917" font-style="italic">门禁）</text>
<text x="348" y="339" text-anchor="start" font-size="8.8" fill="#1c1917" font-style="italic">模型、工作、决策</text>
</svg>
