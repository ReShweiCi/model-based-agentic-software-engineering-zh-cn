<text x="162" y="94" text-anchor="start" font-size="9.2" fill="#1c1917">• 类型与配置</text>
<text x="162" y="106" text-anchor="start" font-size="9.2" fill="#1c1917">• 状态转移规则</text>
<text x="162" y="118" text-anchor="start" font-size="9.2" fill="#1c1917">• 代码或结构</text>
<rect x="306" y="62" width="138" height="90" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65" />
