<?xml version="1.0" encoding="UTF-8"?>
<!-- Localized Chinese SVG (label: mage-method). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 518" width="900" height="1036" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">MAGE 的六项核心主张及其关联</title>
<desc id="desc">主张 1 与主张 2 催生了两条并行原则：建模与对齐。二者共同指导并治理工程工作。反复出现的失败与判断引发治理转化，通过反馈调整后续工作所继承的模型与控制机制。若后续工作持续受益，这些结构便成为工程资本。主张 6 则是对工程工作重组的预测。</desc>
<defs><marker id="arrow" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3 L0 6 Z" fill="black"/></marker></defs>
<polyline points="121,82 121,100 329,100 329,82" fill="none" stroke="black" stroke-width=".9"/>
<polyline points="121,100 121,122" fill="none" stroke="black" stroke-width=".9" marker-end="url(#arrow)"/>
<polyline points="329,100 329,122" fill="none" stroke="black" stroke-width=".9" marker-end="url(#arrow)"/>
<polyline points="121,224 121,246 329,246 329,224" fill="none" stroke="black" stroke-width=".9"/>
<polyline points="225,246 225,270" fill="none" stroke="black" stroke-width=".9" marker-end="url(#arrow)"/>
<polyline points="225,319 225,361" fill="none" stroke="black" stroke-width=".9" marker-end="url(#arrow)"/>
<polyline points="87,393 4,393 4,173 28,173" fill="none" stroke="black" stroke-width=".9" marker-end="url(#arrow)"/>
<polyline points="363,393 446,393 446,173 422,173" fill="none" stroke="black" stroke-width=".9" marker-end="url(#arrow)"/>

<rect x="28" y="4" width="186" height="78" rx="3" fill="white" stroke="black" stroke-width=".75"/>
<text x="121.0" y="20" text-anchor="middle" font-size="9.5" font-weight="700">1 · 商品化智能改变了</text>
<text x="121.0" y="34" text-anchor="middle" font-size="9.5" font-weight="700">软件工程的经济学格局</text>
<text x="121.0" y="52" text-anchor="middle" font-size="9">相对于工程判断力，</text>
<text x="121.0" y="66" text-anchor="middle" font-size="9">实现能力正变得充裕。</text>

<rect x="236" y="4" width="186" height="78" rx="3" fill="white" stroke="black" stroke-width=".75"/>
<text x="329.0" y="22" text-anchor="middle" font-size="9.5" font-weight="700">2 · 规模带来了推理难题</text>
<text x="329.0" y="44" text-anchor="middle" font-size="9">大型软件系统超出了</text>
<text x="329.0" y="58" text-anchor="middle" font-size="9">人类与智能体的推理视界。</text>

<rect x="28" y="122" width="186" height="102" rx="3" fill="#ebebeb" stroke="black" stroke-width=".75"/>
<text x="121.0" y="142" text-anchor="middle" font-size="10" font-weight="700">3 · 建模（Modeling）</text>
<text x="121.0" y="159" text-anchor="middle" font-size="9">有目的的模型可降低工程推理成本。</text>
<text x="121.0" y="182" text-anchor="middle" font-size="9">捕获关键的知识与意图，</text>
<text x="121.0" y="196" text-anchor="middle" font-size="9">同时将无关紧要的细节</text>
<text x="121.0" y="210" text-anchor="middle" font-size="9">保留为开放自由度。</text>

<rect x="236" y="122" width="186" height="102" rx="3" fill="#ebebeb" stroke="black" stroke-width=".75"/>
<text x="329.0" y="142" text-anchor="middle" font-size="10" font-weight="700">4 · 对齐（Alignment）</text>
<text x="329.0" y="159" text-anchor="middle" font-size="9">显式义务使自主实现变得可治理。</text>
<text x="329.0" y="182" text-anchor="middle" font-size="9">约束限制行为，</text>
<text x="329.0" y="196" text-anchor="middle" font-size="9">传感器观测状态，</text>
<text x="329.0" y="210" text-anchor="middle" font-size="9">门禁控制准入。</text>

<rect x="87" y="270" width="276" height="49" rx="3" fill="white" stroke="black" stroke-width=".75"/>
<text x="225.0" y="286" text-anchor="middle" font-size="10" font-weight="700">受治理的工程工作</text>
<text x="225.0" y="302" text-anchor="middle" font-size="9">充分的实现自由度；对关键性质的可靠控制。</text>

<rect x="87" y="361" width="276" height="65" rx="3" fill="white" stroke="black" stroke-width=".75"/>
<text x="225.0" y="378" text-anchor="middle" font-size="10" font-weight="700">5 · 治理转化（Governance conversion）</text>
<text x="225.0" y="393" text-anchor="middle" font-size="9">重复判断沉淀为持久的工程结构。</text>
<text x="225.0" y="406" text-anchor="middle" font-size="9">后续工作直接继承既有的模型与控制机制。</text>
<text x="225.0" y="419" text-anchor="middle" font-size="9">当后续工作持续受益时，即转化为工程资本。</text>

<rect x="28" y="456" width="394" height="57" rx="3" fill="white" stroke="black" stroke-width=".75" stroke-dasharray="4 3"/>
<text x="225.0" y="471" text-anchor="middle" font-size="10" font-weight="700">6 · 对工程工作重组的预测</text>
<text x="225.0" y="485" text-anchor="middle" font-size="9">工程工作将围绕依然稀缺的能力重新组织。</text>
<text x="225.0" y="497" text-anchor="middle" font-size="9">表示 · 证据 · 治理 · 协调 · 判断</text>
<text x="225.0" y="509" text-anchor="middle" font-size="9">对关键决策的最终责任仍归属于工程师。</text>

<rect x="165" y="104" width="120" height="14" fill="white"/><text x="225" y="114.5" text-anchor="middle" font-size="9.5">催生两条核心原则</text>
<rect x="185" y="251" width="80" height="14" fill="white"/><text x="225" y="261.5" text-anchor="middle" font-size="9.5">指导与治理</text>
<rect x="155" y="333" width="140" height="14" fill="white"/><text x="225" y="343.5" text-anchor="middle" font-size="9.5">反复出现的失败与判断</text>
<rect x="18" y="287" width="52" height="26" fill="white"/>
<text x="44" y="298" text-anchor="middle" font-size="9.5">演进</text>
<text x="44" y="310" text-anchor="middle" font-size="9.5">模型</text>
<rect x="380" y="287" width="52" height="26" fill="white"/>
<text x="406" y="298" text-anchor="middle" font-size="9.5">演进</text>
<text x="406" y="310" text-anchor="middle" font-size="9.5">控制</text>
</svg>
