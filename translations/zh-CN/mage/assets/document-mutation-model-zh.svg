<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247.5 235" width="247.5" height="235" role="img" aria-labelledby="dmTitle dmDesc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <title id="dmTitle">DocAble 的文档变更模型：变更经由受许可的接缝触达各格式</title>
  <desc id="dmDesc">修复逻辑通过结构化文档模型（受许可的接缝）执行操作。该模型由各格式专属实现承接，进而操作 DOCX、PPTX、XLSX 和 PDF 等具体格式。</desc>
