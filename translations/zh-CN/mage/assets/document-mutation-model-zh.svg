  <text x="123.75" y="93.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">结构化文档模型</text>
  <text x="123.75" y="107.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">受许可的接缝（sanctioned seam）</text>
