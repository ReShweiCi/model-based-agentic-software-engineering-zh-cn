<svg xmlns="http://www.w3.org/2000/svg" width="782" height="586" viewBox="0 70 782 586" role="img" aria-labelledby="title desc">
<title id="title">带重试机制的作业执行状态模型</title>
<desc id="desc">修复作业的状态模型，包含重试机制与待检验性质。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#282828"/></marker>
  <marker id="brown-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#83472b"/></marker>
  <linearGradient id="header" x2="0" y2="1"><stop stop-color="#e9ebf3"/><stop offset="1" stop-color="#e1e6f1"/></linearGradient>
  <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#e2eef8"/><stop offset="1" stop-color="#cfe3f5"/></linearGradient>
  <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#f1eaf4"/><stop offset="1" stop-color="#e5ddea"/></linearGradient>
  <linearGradient id="green" x2="0" y2="1"><stop stop-color="#edf9df"/><stop offset="1" stop-color="#e0f3d3"/></linearGradient>
  <linearGradient id="yellow" x2="0" y2="1"><stop stop-color="#fff9db"/><stop offset="1" stop-color="#fff0bf"/></linearGradient>
  <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ffe8e5"/><stop offset="1" stop-color="#ffd6d1"/></linearGradient>
</defs>
<style>text {font-family:'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;fill:#111;font-size:18px} .edge {fill:none;stroke:#222;stroke-width:1.2;marker-end:url(#arrow)} .leader {fill:none;stroke:#555;stroke-width:.8}</style>
<rect x="0" y="70" width="782" height="586" fill="white"/><text x="34" y="95" style="font-size:20px;font-style:italic;">包含重试机制的修复作业状态模型。</text><circle cx="56" cy="249" r="9" fill="#292929" stroke="#111" stroke-width="1"/><path d="M65,249 H104" class="edge" style="marker-end:url(#arrow)"/><rect x="105" y="223" width="127" height="52" rx="4" fill="white" stroke="#333" stroke-width="1.2"/><text x="168.5" y="255" style="font-size:19px;" text-anchor="middle">Pending</text><path d="M232,249 L299,248" class="edge" style="marker-end:url(#arrow)"/><rect x="300" y="222" width="135" height="52" rx="4" fill="white" stroke="#333" stroke-width="1.2"/><text x="367.5" y="254" style="font-size:19px;" text-anchor="middle">Running</text><path d="M435,248 L522,249" class="edge" style="marker-end:url(#arrow)"/><rect x="523" y="223" width="150" height="54" rx="4" fill="white" stroke="#333" stroke-width="1.2"/><text x="598" y="256" style="font-size:19px;" text-anchor="middle">Succeeded</text><rect x="295" y="339" width="147" height="64" rx="4" fill="white" stroke="#333" stroke-width="1.2"/><text x="368.5" y="366" style="font-size:19px;font-weight:bold;" text-anchor="middle">Retrying</text><text x="242" y="150" style="font-size:17px;">工作节点为该作业</text><text x="242" y="172" style="font-size:17px;">执行下一项计算。</text><path d="M361,178 L366,216" class="leader"/><text x="630" y="143" style="font-size:17px;">作业完成，</text><text x="630" y="165" style="font-size:17px;">产出已修复</text><text x="630" y="187" style="font-size:17px;">的文档。</text><path d="M619,164 Q602,183 595,216" class="leader"/><path d="M48,536 H738" stroke="#777" stroke-width=".8" fill="none"/><text x="48" y="563" style="font-size:20px;font-weight:bold;">待检验性质</text><text x="48" y="590" style="font-size:18px;">• 最多重试 N 次（例如 N = 3）。</text><text x="48" y="617" style="font-size:18px;">• 每个已启动的作业最终都会到达 Succeeded 或 Failed。</text><text x="48" y="644" style="font-size:18px;">• 只有经过 Running 之后才能到达 Succeeded。</text><text x="265" y="235" text-anchor="middle" style="font-size:17px;">start</text><text x="478" y="235" text-anchor="middle" style="font-size:17px;">success</text><text x="48" y="195" text-anchor="start" style="font-size:17px;">初始 r = 0</text><path d="M367.5,274 V337" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><text x="388" y="305" text-anchor="start" style="font-size:17px;">可修复失败，r &lt; N</text><path d="M295,379 C265,360 266,307 304,273" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><text x="252" y="327" text-anchor="end" style="font-size:17px;">发起下一次尝试；</text><text x="252" y="349" text-anchor="end" style="font-size:17px;">r 递增</text><text x="368.5" y="388" text-anchor="middle" style="font-size:16px;">（尚未开始）</text><path d="M400,274 V285 H722 V478 H675" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="523" y="452" width="150" height="53" rx="4" fill="white" stroke="#333" stroke-width="1.2"/><text x="598" y="484" text-anchor="middle" style="font-size:19px;">Failed</text><text x="705" y="394" text-anchor="end" style="font-size:17px;">不可修复失败，或</text><text x="705" y="416" text-anchor="end" style="font-size:17px;">已达 r = N 时的可修复失败</text></svg>
