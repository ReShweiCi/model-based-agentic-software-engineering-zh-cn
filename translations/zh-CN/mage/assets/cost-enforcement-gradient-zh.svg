<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 0 435 287" width="435" height="287" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">裕度与工程自由度</title>
<desc id="desc">建模定义了不超过 200 毫秒的响应时间义务。实现 A 耗时 120 毫秒（裕度 80 毫秒），实现 B 耗时 195 毫秒（裕度 5 毫秒）。对齐负责测量行为并将证据反馈给建模。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" /></marker></defs>
