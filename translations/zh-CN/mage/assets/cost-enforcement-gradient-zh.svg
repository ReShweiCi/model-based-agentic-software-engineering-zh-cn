<text x="337.5" y="107" text-anchor="middle" font-size="9">5 ms</text>
<text x="54" y="144" text-anchor="middle" font-size="9.5">0 ms</text>
<text x="216" y="143" text-anchor="middle" font-size="9.5">120 ms</text>
<text x="216" y="155" text-anchor="middle" font-size="9.5">(A)</text>
<text x="316" y="143" text-anchor="middle" font-size="9.5">195 ms</text>
<text x="316" y="155" text-anchor="middle" font-size="9.5">(B)</text>
