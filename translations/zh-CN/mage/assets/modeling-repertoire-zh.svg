    <text x="93" y="135" text-anchor="middle" font-size="11" fill="#1c1917">
      <tspan font-weight="700">要求：</tspan><tspan class="math-it" font-size="12">r</tspan><tspan class="math-rm" dx="2" font-size="11.5">&lt; 1%</tspan>
