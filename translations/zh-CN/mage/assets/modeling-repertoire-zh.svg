  <!-- Panel 8: Quantitative -->
  <g transform="translate(192, 514)">
    <text class="card-title" x="93" y="17">定量模型</text>
    <text class="card-q" x="93" y="33">数值多少 / 边界为何？</text>

    <text x="93" y="59" text-anchor="middle" font-size="11" fill="#1c1917">错误率</text>

    <!-- Fraction: r = 错误数 / 请求总数 -->
    <text class="math-it" x="56" y="94" font-size="13.5" text-anchor="end">r</text>
    <text class="math-rm" x="62" y="94" font-size="13" text-anchor="start">=</text>
