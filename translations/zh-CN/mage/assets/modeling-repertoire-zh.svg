    <text class="node-txt" x="44" y="68">IDLE</text>
    <rect class="node-box" x="104" y="52" width="70" height="24"/>
    <text class="node-txt" x="139" y="68">RUNNING</text>
    <rect class="node-box" x="12" y="112" width="64" height="24"/>
    <text class="node-txt" x="44" y="128">FAILED</text>
    <rect class="node-box" x="104" y="112" width="70" height="24"/>
    <text class="node-txt" x="139" y="128">DONE</text>

    <path class="edge-line" d="M76 64 H102" marker-end="url(#arr)"/>
    <path class="edge-line" d="M139 76 V110" marker-end="url(#arr)"/>
    <path class="edge-line" d="M139 76 V94 H44 V110" marker-end="url(#arr)"/>

