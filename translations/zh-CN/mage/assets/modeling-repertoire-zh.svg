<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="570" height="728" viewBox="0 0 570 728"
     role="img" aria-labelledby="repertoire-title repertoire-desc"
     font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" font-size="10.5" fill="#1c1917">
  <title id="repertoire-title">工程建模经验库</title>
  <desc id="repertoire-desc">按“结构与关系”“行为与流向”“决策与证据”三行展示九类常见工程模型：组件/依赖、实体/模式、归属权/资源、有限状态（Finite-state）、控制流、数据流、决策/策略、定量模型、溯源/推导，并列出各自回答的问题、表达的性质与支持的分析方法。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 7 7" refX="6.2" refY="3.5" markerWidth="6" markerHeight="6"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0.5 L6.5 3.5 L0 6.5 Z" fill="#1c1917"/>
    </marker>
    <style>
      .row-hdr { font-size: 12.5px; font-weight: 700; fill: #1c1917; text-anchor: middle; }
      .card-title { font-size: 11.8px; font-weight: 700; fill: #1c1917; text-anchor: middle; }
      .card-q { font-size: 10.2px; fill: #44403c; text-anchor: middle; }
      .node-box { fill: #ffffff; stroke: #292524; stroke-width: 0.9; rx: 3; ry: 3; }
      .node-txt { font-size: 10.5px; fill: #1c1917; text-anchor: middle; }
      .edge-line { fill: none; stroke: #1c1917; stroke-width: 0.95; }
      .edge-cap { font-size: 10.2px; font-style: italic; fill: #44403c; text-anchor: middle; }
      .sec-hdr { font-size: 10.5px; font-weight: 700; fill: #1c1917; }
      .sec-txt { font-size: 10.2px; fill: #292524; }
      .tbl-hdr { font-size: 10.2px; font-weight: 700; fill: #1c1917; }
      .tbl-txt { font-size: 10px; fill: #292524; }
      .math-it { font-family: 'Noto Serif CJK SC', 'DejaVu Serif', Georgia, serif; font-style: italic; }
      .math-rm { font-family: 'Noto Serif CJK SC', 'DejaVu Serif', Georgia, serif; }
    </style>
  </defs>

  <!-- Crisp white background -->
  <rect x="0" y="0" width="570" height="728" fill="#ffffff"/>

  <!-- ==================== ROW HEADERS ==================== -->
  <!-- Row 1: Structure and relationships -->
  <rect x="6" y="6" width="558" height="24" fill="#eceae4"/>
  <text class="row-hdr" x="285" y="22.5">结构与关系</text>
  <line x1="6" y1="30" x2="564" y2="30" stroke="#78716c" stroke-width="0.6"/>

  <!-- Row 2: Behavior and flow -->
  <rect x="6" y="238" width="558" height="24" fill="#eceae4"/>
  <text class="row-hdr" x="285" y="254.5">行为与流向</text>
  <line x1="6" y1="238" x2="564" y2="238" stroke="#57534e" stroke-width="0.8"/>
  <line x1="6" y1="262" x2="564" y2="262" stroke="#78716c" stroke-width="0.6"/>

  <!-- Row 3: Decisions and evidence -->
  <rect x="6" y="490" width="558" height="24" fill="#eceae4"/>
  <text class="row-hdr" x="285" y="506.5">决策与证据</text>
  <line x1="6" y1="490" x2="564" y2="490" stroke="#57534e" stroke-width="0.8"/>
  <line x1="6" y1="514" x2="564" y2="514" stroke="#78716c" stroke-width="0.6"/>

  <!-- Outer frame & grid dividers -->
  <rect x="6" y="6" width="558" height="716" fill="none" stroke="#57534e" stroke-width="0.85"/>

  <!-- Vertical column dividers in each row -->
  <g stroke="#57534e" stroke-width="0.75">
    <line x1="192" y1="30" x2="192" y2="238"/>
    <line x1="378" y1="30" x2="378" y2="238"/>
    <line x1="192" y1="262" x2="192" y2="490"/>
    <line x1="378" y1="262" x2="378" y2="490"/>
    <line x1="192" y1="514" x2="192" y2="722"/>
    <line x1="378" y1="514" x2="378" y2="722"/>
  </g>

  <!-- Title-strip bottom rules -->
  <g stroke="#a8a29e" stroke-width="0.55">
    <line x1="6" y1="70" x2="564" y2="70"/>
    <line x1="6" y1="302" x2="564" y2="302"/>
    <line x1="6" y1="554" x2="564" y2="554"/>
  </g>

  <!-- ==================== ROW 1 ==================== -->

  <!-- Panel 1: Component/dependency -->
  <g transform="translate(6, 30)">
    <text class="card-title" x="93" y="17">组件 / 依赖</text>
    <text class="card-q" x="93" y="33">谁依赖谁？</text>

    <rect class="node-box" x="14" y="50" width="60" height="24"/>
    <text class="node-txt" x="44" y="66">Web</text>
    <rect class="node-box" x="112" y="50" width="60" height="24"/>
    <text class="node-txt" x="142" y="66">API</text>
    <rect class="node-box" x="112" y="92" width="60" height="24"/>
    <text class="node-txt" x="142" y="108">缓存</text>
    <rect class="node-box" x="14" y="92" width="60" height="24"/>
    <text class="node-txt" x="44" y="108">数据库</text>

    <path class="edge-line" d="M74 62 H110" marker-end="url(#arr)"/>
    <path class="edge-line" d="M142 74 V90" marker-end="url(#arr)"/>
    <path class="edge-line" d="M112 104 H76" marker-end="url(#arr)"/>

    <text class="edge-cap" x="93" y="135">依赖于；可达</text>

    <text class="sec-hdr" x="8" y="155">性质</text>
    <text class="sec-hdr" x="100" y="155">分析</text>
    <line x1="8" y1="160" x2="178" y2="160" stroke="#a8a29e" stroke-width="0.6"/>
    <line x1="93" y1="145" x2="93" y2="201" stroke="#c7c2ba" stroke-width="0.6"/>
    <text class="sec-txt" x="8" y="173">可达性、</text>
    <text class="sec-txt" x="8" y="186">分层、</text>
    <text class="sec-txt" x="8" y="199">禁止边</text>
    <text class="sec-txt" x="100" y="173">遍历、环路、</text>
    <text class="sec-txt" x="100" y="186">路径分析</text>
  </g>

  <!-- Panel 2: Entity/schema -->
  <g transform="translate(192, 30)">
    <text class="card-title" x="93" y="17">实体 / 模式</text>
    <text class="card-q" x="93" y="33">实体及其关系是什么？</text>

    <rect class="node-box" x="12" y="71" width="58" height="24"/>
    <text class="node-txt" x="41" y="87">用户</text>
    <rect class="node-box" x="106" y="50" width="66" height="24"/>
    <text class="node-txt" x="139" y="66">文档</text>
    <rect class="node-box" x="106" y="92" width="66" height="24"/>
    <text class="node-txt" x="139" y="108">组织</text>

    <path class="edge-line" d="M70 83 H86 V62 H104" marker-end="url(#arr)"/>
    <path class="edge-line" d="M70 83 H86 V104 H104" marker-end="url(#arr)"/>

    <text class="edge-cap" x="93" y="135">拥有 / 隶属于</text>

    <text class="sec-hdr" x="8" y="155">性质</text>
    <text class="sec-hdr" x="100" y="155">分析</text>
    <line x1="8" y1="160" x2="178" y2="160" stroke="#a8a29e" stroke-width="0.6"/>
    <line x1="93" y1="145" x2="93" y2="201" stroke="#c7c2ba" stroke-width="0.6"/>
    <text class="sec-txt" x="8" y="173">键约束、</text>
    <text class="sec-txt" x="8" y="186">基数、</text>
    <text class="sec-txt" x="8" y="199">引用关系</text>
    <text class="sec-txt" x="100" y="173">连接查询、</text>
    <text class="sec-txt" x="100" y="186">模式校验</text>
  </g>

  <!-- Panel 3: Ownership/resource -->
  <g transform="translate(378, 30)">
    <text class="card-title" x="93" y="17">归属权 / 资源</text>
    <text class="card-q" x="93" y="33">谁可以控制什么？</text>

    <rect class="node-box" x="10" y="50" width="68" height="24"/>
    <text class="node-txt" x="44" y="66">工作线程 A</text>
    <rect class="node-box" x="10" y="92" width="68" height="24"/>
    <text class="node-txt" x="44" y="108">工作线程 B</text>
    <rect class="node-box" x="116" y="71" width="60" height="24"/>
    <text class="node-txt" x="146" y="87">作业 42</text>

    <path class="edge-line" d="M78 62 H95 V78 H114" marker-end="url(#arr)"/>
    <path class="edge-line" stroke-dasharray="3.5 2.5" d="M78 104 H95 V88 H114" marker-end="url(#arr)"/>
    <!-- Cross mark on stale dashed claim -->
    <rect x="90" y="91" width="10" height="10" fill="#ffffff"/>
    <path d="M91.5 92.5 L98.5 99.5 M91.5 99.5 L98.5 92.5" stroke="#1c1917" stroke-width="1.15"/>

    <text class="edge-cap" x="93" y="135">拥有；虚线 = 过期认领</text>

    <text class="sec-hdr" x="8" y="155">性质</text>
    <text class="sec-hdr" x="100" y="155">分析</text>
    <line x1="8" y1="160" x2="178" y2="160" stroke="#a8a29e" stroke-width="0.6"/>
    <line x1="93" y1="145" x2="93" y2="201" stroke="#c7c2ba" stroke-width="0.6"/>
    <text class="sec-txt" x="8" y="173">排他性、</text>
    <text class="sec-txt" x="8" y="186">权属转移、</text>
    <text class="sec-txt" x="8" y="199">资源回收</text>
    <text class="sec-txt" x="100" y="173">交错执行、</text>
    <text class="sec-txt" x="100" y="186">不变量检验</text>
  </g>

