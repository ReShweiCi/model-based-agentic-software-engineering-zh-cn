    <text class="sec-hdr" x="8" y="175">性质</text>
    <text class="sec-hdr" x="100" y="175">分析</text>
    <line x1="8" y1="180" x2="178" y2="180" stroke="#a8a29e" stroke-width="0.6"/>
    <line x1="93" y1="165" x2="93" y2="221" stroke="#c7c2ba" stroke-width="0.6"/>
    <text class="sec-txt" x="8" y="193">合法状态、</text>
    <text class="sec-txt" x="8" y="206">安全性、</text>
    <text class="sec-txt" x="8" y="219">活性</text>
    <text class="sec-txt" x="100" y="193">模型检验、</text>
    <text class="sec-txt" x="100" y="206">状态搜索</text>
  </g>

  <!-- Panel 5: Control flow -->
  <g transform="translate(192, 262)">
    <text class="card-title" x="93" y="17">控制流</text>
    <text class="card-q" x="93" y="33">执行哪条路径？</text>

    <rect class="node-box" x="8" y="54" width="52" height="32"/>
    <text class="node-txt" x="34" y="68">分析</text>
    <text class="node-txt" x="34" y="81">图表</text>

    <!-- Decision diamond -->
    <polygon points="126,45 178,70 126,95 74,70" fill="#ffffff" stroke="#292524" stroke-width="0.9"/>
    <text class="node-txt" x="126" y="68" font-size="10">明显属于</text>
    <text class="node-txt" x="126" y="81" font-size="10">装饰性？</text>

    <rect class="node-box" x="8" y="122" width="74" height="32"/>
    <text class="node-txt" x="45" y="136">标记为</text>
    <text class="node-txt" x="45" y="149">装饰性</text>

    <rect class="node-box" x="96" y="122" width="82" height="32"/>
    <text class="node-txt" x="137" y="136">调用 LLM</text>
    <text class="node-txt" x="137" y="149">生成描述</text>

    <path class="edge-line" d="M60 70 H72" marker-end="url(#arr)"/>
    <path class="edge-line" d="M126 95 V107 H45 V120" marker-end="url(#arr)"/>
    <path class="edge-line" d="M126 95 V107 H137 V120" marker-end="url(#arr)"/>
    <text x="85" y="103.5" text-anchor="middle" font-size="10" fill="#292524">是</text>
    <text x="148" y="114.5" text-anchor="start" font-size="10" fill="#292524">否</text>

    <text class="sec-hdr" x="8" y="175">性质</text>
    <text class="sec-hdr" x="100" y="175">分析</text>
    <line x1="8" y1="180" x2="178" y2="180" stroke="#a8a29e" stroke-width="0.6"/>
    <line x1="93" y1="165" x2="93" y2="221" stroke="#c7c2ba" stroke-width="0.6"/>
    <text class="sec-txt" x="8" y="193">可达路径、</text>
    <text class="sec-txt" x="8" y="206">分支覆盖</text>
    <text class="sec-txt" x="100" y="193">路径分析、</text>
