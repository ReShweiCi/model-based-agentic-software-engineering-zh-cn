<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 264" width="448" height="264" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">围绕拟议变更的治理机制</title>
<desc id="desc">一项拟议的报表变更经过约束检查与插桩测试，并在门禁处对照架构模型进行评估。全部必需检查通过则接受变更，否则退回修复。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker></defs>
<rect x="122" y="2" width="202" height="30" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="223" y="14" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">拟议的报表功能变更</text>
<text x="223" y="26" text-anchor="middle" font-size="9.2" fill="#1c1917">待合并候选变更</text>
<rect x="2" y="50" width="186" height="68" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<rect x="258" y="50" width="186" height="68" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<text x="95" y="63" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">约束（Constraint）</text>
<text x="95" y="76" text-anchor="middle" font-size="9.2" fill="#1c1917" font-style="italic">允许发生什么？</text>
<text x="95" y="91" text-anchor="middle" font-size="9" fill="#1c1917">暴露账单 API；</text>
<text x="95" y="102" text-anchor="middle" font-size="9" fill="#1c1917">隐藏私有数据库连接器。</text>
<text x="95" y="113" text-anchor="middle" font-size="9" fill="#1c1917">通用网络调用仍有可能。</text>
<text x="351" y="63" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">传感器（Sensor）</text>
<text x="351" y="76" text-anchor="middle" font-size="9.2" fill="#1c1917" font-style="italic">我们有哪些证据？</text>
<text x="351" y="96" text-anchor="middle" font-size="9" fill="#1c1917">插桩测试记录</text>
<text x="351" y="108" text-anchor="middle" font-size="9" fill="#1c1917">调用方、目标地址与结果。</text>
<rect x="2" y="146" width="174" height="58" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<rect x="200" y="146" width="244" height="58" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<text x="89" y="159" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">架构模型</text>
<text x="89" y="178" text-anchor="middle" font-size="9" fill="#1c1917">报表模块须经账单 API 访问，</text>
<text x="89" y="190" text-anchor="middle" font-size="9" fill="#1c1917">禁止直连账单数据库。</text>
<text x="322" y="158" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">门禁（Gate）</text>
<text x="322" y="171" text-anchor="middle" font-size="9.2" fill="#1c1917" font-style="italic">这能否放行？</text>
<text x="322" y="186" text-anchor="middle" font-size="9" fill="#1c1917">对照架构模型评估构建结果</text>
<text x="322" y="198" text-anchor="middle" font-size="9" fill="#1c1917">与记录的交互行为。</text>
<rect x="2" y="236" width="174" height="24" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<rect x="258" y="236" width="186" height="24" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="89" y="252" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">接受变更</text>
<text x="351" y="252" text-anchor="middle" font-size="9.5" fill="#1c1917" font-weight="700">退回修复</text>
<path d="M223 32 L223 146" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M164 32 L164 38 L95 38 L95 50" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M282 32 L282 38 L351 38 L351 50" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M95 118 L95 134 L211 134 L211 146" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M351 118 L351 146" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M176 175 L200 175" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="153" y="130" text-anchor="middle" font-size="9" fill="#1c1917">构建检查结果</text>
<text x="360" y="130" text-anchor="start" font-size="9" fill="#1c1917">记录的</text>
<text x="360" y="142" text-anchor="start" font-size="9" fill="#1c1917">交互行为</text>
<path d="M245 204 L245 220 L89 220 L89 236" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M351 204 L351 236" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="165" y="216" text-anchor="middle" font-size="9" fill="#1c1917">检查通过</text>
<text x="361" y="217" text-anchor="start" font-size="8.8" fill="#1c1917">必需检查失败</text>
<text x="361" y="229" text-anchor="start" font-size="8.8" fill="#1c1917">或缺少证据</text>
</svg>
