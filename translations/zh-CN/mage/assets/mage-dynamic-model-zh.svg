<svg xmlns="http://www.w3.org/2000/svg" width="888" height="612" viewBox="0 0 444 306" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">MAGE 动态模型</title>
<desc id="desc">既有工程知识初始化受治理的工程环境。工单、智能体产能与该环境共同塑造尝试开展的工作及其结果。观测到的问题可引发诊断与适应。纠正性反馈修订继承下来的环境，从而可能支持更大规模的任务与更高的并发度。</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<rect x="88.3" y="3.74" width="213.1" height="29.64" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="194.84" y="15.6" font-size="10.5" text-anchor="middle" font-weight="700">既有工程知识</text>
<text x="194.84" y="27" font-size="8.5" text-anchor="middle">标准、需求、现有资产、既有经验</text>
<path d="M190.01,33.38 L190.01,51.48" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="198.74" y="44" font-size="8.5" text-anchor="start">初始化</text>
<rect x="68.33" y="51.48" width="247.73" height="32.76" rx="0.12" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.9"/>
<text x="192.19" y="64.9" font-size="10.5" text-anchor="middle" font-weight="700">受治理的工程环境（GEE）</text>
<text x="192.19" y="77" font-size="8.5" text-anchor="middle">表示 · 覆盖度 · 一致性 · 经济性</text>
<path d="M190.01,84.24 L190.01,117.94" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="197.81" y="96" font-size="9.5" text-anchor="start" font-weight="700">可行工作</text>
<text x="197.81" y="107" font-size="8.5" text-anchor="start">可能支持更大规模任务与更高并发度</text>
<rect x="3.12" y="117.94" width="87.98" height="41.18" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="47.11" y="130" font-size="10.5" text-anchor="middle" font-weight="700">工单</text>
<text x="47.11" y="142.5" font-size="8.5" text-anchor="middle">任务、意图、</text>
<text x="47.11" y="153" font-size="8.5" text-anchor="middle">验收标准</text>
<rect x="136.34" y="117.94" width="104.21" height="39.94" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="188.45" y="130" font-size="10.5" text-anchor="middle" font-weight="700">尝试开展的工作</text>
<text x="188.45" y="142.5" font-size="8.5" text-anchor="middle">承担的变更、</text>
<text x="188.45" y="153" font-size="8.5" text-anchor="middle">范围与并发度</text>
<rect x="283.3" y="117.94" width="91.42" height="43.06" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="329.0" y="129" font-size="10.5" text-anchor="middle" font-weight="700">智能体产能</text>
<text x="329.0" y="140" font-size="8.5" text-anchor="middle">模型能力、</text>
<text x="329.0" y="149.5" font-size="8.5" text-anchor="middle">并发度、</text>
<text x="329.0" y="159" font-size="8.5" text-anchor="middle">实现速度</text>
<path d="M91.1,140.71 L136.34,140.71" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="113.57" y="126" font-size="8.5" text-anchor="middle">规定</text>
<text x="113.57" y="136.5" font-size="8.5" text-anchor="middle">预期工作</text>
<path d="M283.3,140.71 L240.55,140.71" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="261.9" y="126" font-size="8.5" text-anchor="middle">驱动</text>
<text x="261.9" y="136.5" font-size="8.5" text-anchor="middle">执行</text>
<path d="M190.01,157.87 L190.01,174.1" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="197.81" y="168.5" font-size="8.5" text-anchor="start">产出</text>
<rect x="109.51" y="174.1" width="162.55" height="34.01" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="190.79" y="185.5" font-size="10.5" text-anchor="middle" font-weight="700">实际达成表现</text>
<text x="190.79" y="196.5" font-size="8.5" text-anchor="middle">持久吞吐量、缺陷逃逸、</text>
<text x="190.79" y="206" font-size="8.5" text-anchor="middle">人类注意力负担</text>
<path d="M190.01,208.1 L190.01,225.26" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="196.87" y="218" font-size="8.5" text-anchor="start">提供证据</text>
<rect x="0.31" y="225.26" width="375.15" height="76.47" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.8"/>
<text x="187.89" y="238.5" font-size="11" text-anchor="middle" font-weight="700">经验与适应</text>
<rect x="7.48" y="244.92" width="114.82" height="48.08" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="64.9" y="256.5" font-size="10" text-anchor="middle" font-weight="700">观测到的问题</text>
<text x="64.9" y="268.5" font-size="8.5" text-anchor="middle">返工震荡、反复失败、</text>
<text x="64.9" y="279.5" font-size="8.5" text-anchor="middle">人工干预、控制摩擦</text>
<rect x="134.47" y="244.92" width="102.34" height="48.08" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="185.64" y="256.5" font-size="10" text-anchor="middle" font-weight="700">诊断</text>
<text x="185.64" y="268" font-size="8.5" text-anchor="middle">局部缺陷？</text>
<text x="185.64" y="278.5" font-size="8.5" text-anchor="middle">结构缺口？</text>
<text x="185.64" y="289" font-size="8.5" text-anchor="middle">强制执行不足？</text>
<rect x="245.1" y="244.92" width="123.19" height="48.08" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="306.7" y="256.5" font-size="10" text-anchor="middle" font-weight="700">治理适应</text>
<text x="306.7" y="269" font-size="8.5" text-anchor="middle">转化、协调、</text>
<text x="306.7" y="280" font-size="8.5" text-anchor="middle">退役</text>
<path d="M122.30,264.58 L134.47,264.58" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<path d="M236.81,264.58 L245.1,264.58" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<path d="M368.29 265.2 H369.1 Q380.95 265.2 380.95 253.34 V80.18 Q380.95 67.7 368.47 67.7 H316.06" fill="none" stroke="black" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="386.26" y="127.61" font-size="10" text-anchor="start" font-weight="700">纠正性</text>
<text x="386.26" y="140.11" font-size="10" text-anchor="start" font-weight="700">反馈</text>
<text x="389" y="153" font-size="8.5" text-anchor="start">修订</text>
<text x="389" y="164" font-size="8.5" text-anchor="start">共享</text>
<text x="389" y="175" font-size="8.5" text-anchor="start">结构</text>
</g>
</svg>
