<title id="title">模型一致、义务符合与准入</title>
<desc id="desc">受治理的工程环境包含工程模型、禁止直连数据库的约束义务以及准入决策。对应关系比较实现与模型，符合性比较实现与义务，验收则是受治理的工程环境决定是否放行实现。</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
