<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1043" viewBox="0 0 1064 1043" role="img" aria-labelledby="entT entD" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="entT">从额度余额检查演进为显式上传准入决策</title>
<desc id="entD">四个编号面板分别说明旧版余额检查、引入无限权益、实际发生的客户端上传拦截故障以及重构后的模型。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10z" fill="#1c1917"/></marker></defs>
<rect width="100%" height="100%" fill="#fdfcf9"/>
<rect x="14" y="14" width="504" height="322" rx="12" fill="none" stroke="#d0ccc5" stroke-width="2"/>
<rect x="546" y="14" width="504" height="322" rx="12" fill="none" stroke="#d0ccc5" stroke-width="2"/>
<rect x="14" y="364" width="504" height="665" rx="12" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="546" y="364" width="504" height="665" rx="12" fill="none" stroke="#155c38" stroke-width="2"/>
<text x="266" y="45.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#1c1917">(1) 旧版余额检查</text>
<text x="266" y="77" text-anchor="middle" dominant-baseline="central" font-size="21" font-style="italic" fill="#1c1917">仅表示有限额度</text>
<text x="798" y="45.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#1c1917">(2) 引入无限使用群组</text>
<text x="798" y="77" text-anchor="middle" dominant-baseline="central" font-size="21" font-style="italic" fill="#1c1917">权益现在包含两种情形</text>
<text x="798" y="255.7" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">仅凭有限余额无法</text>
<text x="798" y="283.3" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">识别无限使用权益。</text>
<text x="266" y="395.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#1c1917">(3) 客户端拒绝上传</text>
<text x="266" y="430.5" text-anchor="middle" dominant-baseline="central" font-size="21" font-style="italic" fill="#1c1917">38 页 Office 文档上传</text>
<text x="266" y="980" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">服务端准入逻辑从未被触达。</text>
<text x="798" y="395.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#1c1917">(4) 分离准入决策与展示投影</text>
<text x="798" y="430.5" text-anchor="middle" dominant-baseline="central" font-size="21" font-style="italic" fill="#1c1917">同一群组与请求；无上限</text>
<text x="798" y="910.2" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">准入采用结构化决策。</text>
<text x="798" y="937.8" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">展示值不参与权限判定。</text>
<rect x="63" y="91" width="406" height="49" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="266" y="115.5" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">各群组有限额度余额</text>
<rect x="154" y="175" width="224" height="42" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="266" y="196" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">余额求和</text>
<rect x="63" y="248.5" width="406" height="63" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="266" y="265.6" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">客户端比较</text>
<text x="266" y="294.4" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">余额与请求所需额度</text>
<rect x="658" y="91" width="280" height="49" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="798" y="115.5" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">群组权益</text>
<rect x="577.5" y="168" width="196" height="56" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="675.5" y="196" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">有限余额</text>
<rect x="822.5" y="168" width="196" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="920.5" y="196" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">无限模式</text>
<rect x="63" y="455" width="406" height="77" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="266" y="479.1" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">一个无限使用个人群组</text>
<text x="266" y="507.9" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">有限余额 = 0</text>
<rect x="63" y="563.5" width="406" height="84" rx="10" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="591.1" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">服务端对有限余额求和</text>
<text x="266" y="619.9" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">并排除无限群组</text>
<rect x="133" y="679" width="266" height="49" rx="10" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="703.5" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">credit_balance = 0</text>
<rect x="63" y="763" width="406" height="84" rx="10" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="790.6" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">客户端上传检查：0 &lt; 38</text>
<text x="266" y="819.4" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">忽略独立的无限状态信号</text>
<rect x="101.5" y="882" width="329" height="49" rx="10" fill="#9a3f12" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="906.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#fdfcf9">在 POST 之前直接拒绝</text>
<rect x="595" y="455" width="406" height="77" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="798" y="479.1" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">按群组表示的权益</text>
<text x="798" y="507.9" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">无限模式；有限余额 = 0</text>
<rect x="567" y="588" width="217" height="77" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="675.5" y="612.1" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">准入规则</text>
<text x="675.5" y="640.9" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">+ 上传请求</text>
<rect x="812" y="588" width="217" height="77" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="920.5" y="612.1" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">展示</text>
<text x="920.5" y="640.9" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#1c1917">投影</text>
<rect x="567" y="705.25" width="217" height="115.5" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="675.5" y="735.4" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917" font-weight="700">admit = True</text>
<text x="675.5" y="763" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">选定的授权群组</text>
<text x="675.5" y="790.6" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">admit_unlimited</text>
<rect x="812" y="705.25" width="217" height="115.5" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="920.5" y="749.2" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">无限哨兵值</text>
<text x="920.5" y="776.8" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#1c1917">（仅用于展示）</text>
<path d="M266,140 L266,175" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M266,217 L266,248.5" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M266,532 L266,563.5" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M266,647.5 L266,679" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M266,728 L266,763" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M266,847 L266,882" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M675.5,665 L675.5,705.25" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M920.5,665 L920.5,705.25" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M798,140 V154 H675.5 V168" fill="none" stroke="#1c1917" stroke-width="2"/>
<path d="M798,140 V154 H920.5 V168" fill="none" stroke="#1c1917" stroke-width="2"/>
<path d="M798,532 V560 H675.5 V588" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
<path d="M798,532 V560 H920.5 V588" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
</svg>
