<?xml version="1.0" encoding="UTF-8"?>
<!-- Localized Chinese SVG (label: census-trio). -->
<svg xmlns="http://www.w3.org/2000/svg" width="592" height="288" viewBox="0 0 444 216" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">控制机制的三种视图</title>
<desc id="desc">控制机制体系为控制目录、交互图和覆盖视图提供数据来源；独立识别的工程约束义务同样输入覆盖视图。压缩提交规则与变更量上限保护共用提交集。原子化交付追溯至压缩提交规则，有界的变更范围追溯至变更量上限保护。成本上限缺少覆盖，而遗留导出检查缺少记录在案的设立理由。</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<rect x="101" y="3" width="166" height="33" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="184" y="16" font-size="10.5" text-anchor="middle" font-weight="700">控制机制体系</text>
<text x="184" y="29" font-size="8.5" text-anchor="middle" font-style="italic">控制机制 · 共享资源</text>
<rect x="341" y="3" width="96" height="33" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="389" y="16" font-size="9.5" text-anchor="middle" font-weight="700">工程</text>
<text x="389" y="28" font-size="9.5" text-anchor="middle" font-weight="700">约束义务</text>
<path d="M184,36 L184,49" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M59,49 L337,49" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M59,49 L59,63" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M198,49 L198,63" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M337,49 L337,63" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M389,36 L389,49" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M389,49 L373,49" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M373,49 L373,63" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="1" y="64" width="116" height="150" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<rect x="1.8" y="95" width="114.4" height="118.2" rx="0" fill="white" stroke="white" stroke-width="0"/>
<rect x="1" y="64" width="116" height="150" rx="4" fill="none" stroke="#1c1917" stroke-width=".7"/>
<text x="59.0" y="77" font-size="9.5" text-anchor="middle" font-weight="700">控制目录</text>
<text x="59.0" y="89" font-size="8.5" text-anchor="middle" font-style="italic">现有哪些机制？</text>
<rect x="121" y="64" width="155" height="150" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<rect x="121.8" y="95" width="153.4" height="118.2" rx="0" fill="white" stroke="white" stroke-width="0"/>
<rect x="121" y="64" width="155" height="150" rx="4" fill="none" stroke="#1c1917" stroke-width=".7"/>
<text x="198.5" y="77" font-size="9.5" text-anchor="middle" font-weight="700">交互图</text>
<text x="198.5" y="89" font-size="8.5" text-anchor="middle" font-style="italic">哪些机制会冲突？</text>
<rect x="280" y="64" width="163" height="150" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<rect x="280.8" y="95" width="161.4" height="118.2" rx="0" fill="white" stroke="white" stroke-width="0"/>
<rect x="280" y="64" width="163" height="150" rx="4" fill="none" stroke="#1c1917" stroke-width=".7"/>
<text x="361.5" y="77" font-size="9.5" text-anchor="middle" font-weight="700">覆盖视图</text>
<text x="361.5" y="89" font-size="8.5" text-anchor="middle" font-style="italic">哪些义务已被治理？</text>
