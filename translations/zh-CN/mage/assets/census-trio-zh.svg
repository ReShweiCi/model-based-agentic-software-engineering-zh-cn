<text x="246" y="156" font-size="8.5" text-anchor="middle" font-style="italic">互不兼容的</text>
<text x="246" y="167" font-size="8.5" text-anchor="middle" font-style="italic">约束义务</text>
<rect x="283" y="103" width="96" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
