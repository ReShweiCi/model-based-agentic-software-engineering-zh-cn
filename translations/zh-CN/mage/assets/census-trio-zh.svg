<rect x="283" y="178" width="96" height="21" rx="4" fill="white" stroke="#1c1917" stroke-dasharray="3 2" stroke-width="0.7"/>
<text x="331" y="192" font-size="8.5" text-anchor="middle">成本上限</text>
<rect x="398" y="178" width="39" height="21" rx="4" fill="white" stroke="#1c1917" stroke-dasharray="3 2" stroke-width="0.7"/>
<text x="417.5" y="192" font-size="8.5" text-anchor="middle" font-weight="700">[C]</text>
<text x="331" y="210" font-size="8.5" text-anchor="middle" font-weight="700">覆盖缺口</text>
<text x="412" y="210" font-size="8.5" text-anchor="middle" font-weight="700">候选孤儿机制</text>
