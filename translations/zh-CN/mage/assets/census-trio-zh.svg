<rect x="283" y="140" width="96" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="331" y="154.0" font-size="8.5" text-anchor="middle">有界的变更范围</text>
<path d="M379,151 L397,151" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="398" y="140" width="39" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
