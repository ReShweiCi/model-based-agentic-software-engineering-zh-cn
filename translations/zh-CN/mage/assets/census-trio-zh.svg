<path d="M379,114 L397,114" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="398" y="103" width="39" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
