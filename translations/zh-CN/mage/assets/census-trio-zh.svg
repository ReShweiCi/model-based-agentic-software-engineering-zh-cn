<rect x="126" y="182" width="83" height="28" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="167.5" y="193" font-size="8" text-anchor="middle">[B] 变更量上限保护</text>
<text x="167.5" y="205" font-size="8" text-anchor="middle" font-style="italic">最大变更量限制</text>
<path d="M169,128 L169,144" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M169,182 L169,166" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<path d="M211,130 Q214,130 214,133 V151 Q214,155 217,155 Q214,155 214,159 V177 Q214,180 211,180" fill="none" stroke="#1c1917" stroke-width=".65"/>
