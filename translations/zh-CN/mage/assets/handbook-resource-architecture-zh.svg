<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 440 320" role="img" aria-labelledby="title desc"><title id="title">资源感知的修复执行</title><desc id="desc">流式提取将输入文档分离为结构骨架与外部媒体载荷。主执行路径经由计算图、已配置的并发上限、活动计算与流式重组产出输出文档。载荷引用按需向活动消费者与重组阶段解析。度量数据用于检验资源模型与性能模型的假设。</desc><defs><marker id="arrow" markerWidth="4.5" markerHeight="4" refX="4.4" refY="2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L4.5,2 L0,4 Z" fill="black"/></marker></defs><rect width="440" height="320" fill="white"/>
