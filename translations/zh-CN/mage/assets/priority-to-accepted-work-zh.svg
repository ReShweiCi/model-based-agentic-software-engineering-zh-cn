<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="837" viewBox="0 0 444 279" role="img" aria-labelledby="title desc"><title id="title">从工程优先级到已验收工作</title><desc id="desc">优先级、设计、工作单、智能体实现、验收门禁与已集成工作构成一条从左到右的工作流。浅灰色的工程模型为工作单提供范围与上下文，并为门禁提供模型派生的约束义务；独立的验收证据另行输入。验收失败的工作返回修复；未决的人工判断则修订设计而不绕过验收。发生中断时，持久化提交与部分工件输入恢复流程，经检查后再恢复实现。</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="444" height="279" fill="white"/>
