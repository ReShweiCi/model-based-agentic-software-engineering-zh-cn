<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292.5 137" width="292.5" height="137" role="img" aria-labelledby="canonical-structuralT canonical-structuralD" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <title id="canonical-structuralT">典型结构模型：通读缓存架构</title>
  <desc id="canonical-structuralD">线性依赖示例：WEB 依赖 API；API 通过 CACHE 读取；CACHE 从 DATABASE 加载。这些箭头声明结构关系而非请求时间线。从 WEB 直接指向 DATABASE 的带叉虚线表示被禁止的绕过路径。</desc>
  <defs>
    <marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169" /></marker>
    <marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e" /></marker>
    <marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438" /></marker>
    <marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917" /></marker>
  </defs>
  <text x="146.25" y="14.0" text-anchor="middle" font-size="11.5" fill="#1c1917" font-weight="700">结构模型</text>
  <text x="146.25" y="29.0" text-anchor="middle" font-size="9" fill="#57534e">通读缓存架构示例</text>
  <rect x="5" y="64" width="61" height="27" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8" />
  <text x="35.5" y="81.0" text-anchor="middle" font-size="10" fill="#ad420d" font-weight="700">Web</text>
  <rect x="79" y="64" width="61" height="27" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8" />
  <text x="109.5" y="81.0" text-anchor="middle" font-size="10" fill="#ad420d" font-weight="700">API</text>
  <rect x="153" y="64" width="61" height="27" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8" />
  <text x="183.5" y="81.0" text-anchor="middle" font-size="10" fill="#ad420d" font-weight="700">缓存</text>
  <rect x="227" y="64" width="61" height="27" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8" />
  <text x="257.5" y="81.0" text-anchor="middle" font-size="10" fill="#ad420d" font-weight="700">数据库</text>
  <path d="M66,77.5 L79,77.5" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)" />
  <text x="72.5" y="51.0" text-anchor="middle" font-size="8.5" fill="#57534e">依赖于</text>
  <path d="M140,77.5 L153,77.5" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)" />
  <text x="146.5" y="51.0" text-anchor="middle" font-size="8.5" fill="#57534e">经此读取</text>
  <path d="M214,77.5 L227,77.5" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)" />
  <text x="220.5" y="51.0" text-anchor="middle" font-size="8.5" fill="#57534e">加载自</text>
