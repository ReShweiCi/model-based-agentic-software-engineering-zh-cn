<svg xmlns="http://www.w3.org/2000/svg" width="592" height="458.667" viewBox="0 0 444 344" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
<title id="title">软件工厂中的概率</title>
<desc id="desc">工程意图被编码为性质，经由制造器履行并产出实现体。编码后的性质同时为可能的实现体提供容差，独立测量为变更的准入或拒绝提供依据。</desc>
