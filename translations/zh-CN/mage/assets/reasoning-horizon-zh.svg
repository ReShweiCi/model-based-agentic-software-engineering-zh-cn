<title id="title">引导智能体的两种方式</title><desc id="desc">引导智能体的两种方式。(a) 对比从原始代码以较高代价重构相关结构，与从有目的的表示中以较低代价检索相关结构。(b) 展示从提出变更、运行工具、观察结果到修订重试的反馈循环，持续迭代直至满足验收标准或工作停止。</desc>
