<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="702" viewBox="0 0 444 234" role="img" aria-labelledby="title desc"><title id="title">领域义务保持稳定的可替换推理</title><desc id="desc">任务模型与工作流模型指导两种可替换引擎：步骤图执行器或规划智能体。能力与选择知识指导引擎内部的模型选择。两种引擎均产出受操作模型约束的类型化提案，并通过受控应用边界作用于当前工件。独立评估与验收模型指导最终验收。限制变更权威不仅需要类型化请求接口。</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="444" height="234" fill="white"/>
