<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 476" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif" role="img">
  <title>从工程模型到判断的链条：工程模型表征性质，度量指标评估其某一侧面，测量值是在既定条件下应用度量指标所得的结果，测量值作为依据支撑证据，最终结合其他证据形成判断</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, panel #f6f4ef, subordinate #57534e -->
  <rect x="0" y="0" width="300" height="476" fill="#fdfcf9"/>

  <defs>
    <marker id="pj-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- nodes -->
  <rect x="55" y="8" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="30" text-anchor="middle" font-size="16" fill="#1c1917">工程模型</text>

  <rect x="55" y="90" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="112" text-anchor="middle" font-size="16" fill="#1c1917">性质</text>

  <rect x="55" y="172" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="194" text-anchor="middle" font-size="16" fill="#1c1917">度量指标</text>

  <rect x="55" y="254" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="276" text-anchor="middle" font-size="16" fill="#1c1917">测量值</text>

  <rect x="55" y="336" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="358" text-anchor="middle" font-size="16" fill="#1c1917">证据</text>

  <rect x="55" y="418" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="440" text-anchor="middle" font-size="16" fill="#1c1917">判断</text>

  <!-- labeled edges -->
  <line x1="92" y1="42" x2="92" y2="86" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="70" text-anchor="start" font-size="13" fill="#57534e">表征</text>

  <line x1="92" y1="124" x2="92" y2="168" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="152" text-anchor="start" font-size="13" fill="#57534e">评估方式</text>

  <line x1="92" y1="206" x2="92" y2="250" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="226" text-anchor="start" font-size="13" fill="#57534e">在既定条件下</text>
  <text x="104" y="242" text-anchor="start" font-size="13" fill="#57534e">加以应用</text>

  <line x1="92" y1="288" x2="92" y2="332" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="316" text-anchor="start" font-size="13" fill="#57534e">作为依据支撑</text>

  <line x1="92" y1="370" x2="92" y2="414" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="390" text-anchor="start" font-size="13" fill="#57534e">结合其他证据</text>
  <text x="104" y="406" text-anchor="start" font-size="13" fill="#57534e">加以阐释</text>
</svg>
